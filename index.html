<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#A9541F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xếp Ca">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Xếp Ca — Cơ sở 3</title>
<style>
  :root{
    --bg:#F4ECE1; --surface:#FFFDF9; --surface-2:#FBF5EC;
    --ink:#2E211B; --muted:#8C7C6E; --line:#E7DBCB;
    --brand:#A9541F; --brand-ink:#8A3F13; --brand-soft:#F3E1D2;
    --m:#E0912F; --a:#2E9E8F; --e:#7C5AC9; --full:#C4552A; --off:#B9AC9C;
    --danger:#C6362F; --danger-soft:#FBE4E2; --ok:#2E9E8F;
    --shadow:0 1px 2px rgba(46,33,27,.06),0 6px 20px rgba(46,33,27,.08);
    --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select{font-family:inherit;font-size:16px}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- App frame ---------- */
  #app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header.top{
    position:sticky;top:0;z-index:30;
    padding:calc(var(--safe-t) + 12px) 16px 12px;
    background:linear-gradient(180deg,rgba(244,236,225,.98),rgba(244,236,225,.86));
    backdrop-filter:saturate(1.4) blur(10px);
    display:flex;align-items:center;gap:12px;
  }
  header.top .cup{
    width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(160deg,#3B261E,#78482C);
    display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)
  }
  header.top .ttl{flex:1;min-width:0}
  header.top .ttl b{display:block;font-size:19px;letter-spacing:-.02em}
  header.top .ttl span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  main{flex:1;padding:8px 16px 96px}
  .view{display:none}
  .view.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- Bottom tab bar ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;max-width:640px;margin:0 auto;
    padding:6px 6px calc(var(--safe-b) + 6px);
    background:rgba(255,253,249,.92);backdrop-filter:blur(14px) saturate(1.3);
    border-top:1px solid var(--line);
  }
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);border-radius:12px}
  nav.tabs button svg{width:24px;height:24px}
  nav.tabs button span{font-size:10.5px;font-weight:600;letter-spacing:-.01em}
  nav.tabs button.on{color:var(--brand)}
  nav.tabs button.on svg{transform:translateY(-1px)}

  /* ---------- Cards & bits ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .row{display:flex;align-items:center;gap:12px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)}
  .sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 10px}
  .sec-title:first-child{margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:34px 18px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--line);box-shadow:none}
  .btn.wide{width:100%}
  .btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:11px}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
  .icon-btn svg{width:20px;height:20px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px}
  .field input,.field select{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand);background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* period color chips */
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .c-m{background:var(--m)} .c-a{background:var(--a)} .c-e{background:var(--e)} .c-full{background:var(--full)} .c-off{background:var(--off)}
  .bg-m{background:#FBEBD3;color:#8a5410} .bg-a{background:#D8F0EC;color:#186b60} .bg-e{background:#E9E2FA;color:#4b34a0} .bg-full{background:#F6DFD3;color:#8f3a17} .bg-off{background:#ECE6DE;color:#7a6d5f}

  /* ---------- Week grid ---------- */
  .week-toolbar{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
  .weeknav{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .weeknav button{width:46px;height:46px;display:grid;place-items:center;color:var(--brand)}
  .weeknav .wlabel{flex:1;text-align:center;line-height:1.15;padding:4px}
  .weeknav .wlabel b{font-size:14.5px}
  .weeknav .wlabel span{display:block;font-size:11.5px;color:var(--muted)}

  .grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
  table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
  table.grid thead th{
    position:sticky;top:0;z-index:5;background:var(--surface-2);
    padding:8px 6px;text-align:center;min-width:96px;font-size:12px;color:var(--muted);font-weight:700
  }
  table.grid thead th b{display:block;color:var(--ink);font-size:14px}
  table.grid thead th.today{background:var(--brand-soft);color:var(--brand-ink)}
  table.grid thead th.today b{color:var(--brand-ink)}
  .name-col{
    position:sticky;left:0;z-index:6;background:var(--surface);
    min-width:104px;max-width:120px;padding:8px 10px;text-align:left;
    box-shadow:2px 0 0 var(--line)
  }
  thead .name-col{z-index:8;background:var(--surface-2)}
  .name-col .nm{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name-col .hrs{font-size:11.5px;color:var(--muted);margin-top:2px}
  td.cell{padding:5px;min-width:96px;height:56px;background:var(--surface)}
  td.cell:active{background:var(--surface-2)}
  td.cell.today{background:#FFFDF4}
  .chip{
    display:block;border-radius:9px;padding:5px 7px;margin-bottom:4px;font-size:12px;font-weight:700;line-height:1.15;text-align:left;position:relative
  }
  .chip .pos{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:1px}
  .chip.warn{box-shadow:0 0 0 2px var(--danger)}
  .chip .wbang{position:absolute;top:-6px;right:-4px;font-size:12px}
  .cell .add-hint{color:var(--line);font-size:20px;font-weight:400;text-align:center;line-height:46px}
  td.cell.sel{box-shadow:inset 0 0 0 3px var(--brand)}
  td.foot{position:sticky;bottom:0;background:var(--surface-2);font-size:11px;text-align:center;padding:6px 4px;color:var(--muted)}
  .name-col.footname{background:var(--surface-2)}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:12px 4px 0}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

  .swapbar{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid #E7C9B2;color:var(--brand-ink);padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:13.5px;font-weight:600}

  /* warnings banner */
  .warnbox{background:var(--danger-soft);border:1px solid #F0C4C0;border-radius:14px;padding:12px 14px;margin-top:14px}
  .warnbox h3{font-size:13px;color:var(--danger);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
  .warnbox ul{margin:0;padding-left:18px}
  .warnbox li{font-size:13.5px;margin:3px 0;color:#7d2622}

  /* ---------- Today ---------- */
  .today-hero{background:linear-gradient(155deg,#B5652E,#8A3F13);color:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .today-hero .dow{font-size:13px;opacity:.85;font-weight:600}
  .today-hero .date{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px}
  .today-hero .stats{display:flex;gap:18px}
  .today-hero .stats div b{display:block;font-size:22px;line-height:1}
  .today-hero .stats div span{font-size:11.5px;opacity:.85}
  .period-block{margin-top:14px}
  .period-block .ph{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-weight:700;font-size:14px}
  .worker{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .worker:last-child{border-bottom:0}
  .worker .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto}
  .worker .info{flex:1;min-width:0}
  .worker .info b{font-size:15px}
  .worker .info span{display:block;font-size:12.5px;color:var(--muted)}

  /* list items */
  .li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
  .li .info{flex:1;min-width:0}
  .li .info b{font-size:15.5px}
  .li .info span{display:block;font-size:12.5px;color:var(--muted)}
  .li .chev{color:var(--line)}

  .fab{position:fixed;right:calc(50% - 320px + 18px);bottom:calc(var(--safe-b) + 78px);z-index:35}
  @media(max-width:672px){.fab{right:18px}}
  .fab button{width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(169,84,31,.4)}
  .fab button svg{width:26px;height:26px}

  /* ---------- Sheet (modal) ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(30,20,15,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;
    background:var(--surface);border-radius:22px 22px 0 0;
    padding:8px 16px calc(var(--safe-b) + 18px);
    transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:90vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.2)
  }
  .sheet.show{transform:none}
  .grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
  .sheet h2{font-size:19px;margin-bottom:2px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}

  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .opt{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13.5px;text-align:left}
  .opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
  .opt small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .opt.on small{color:var(--brand)}
  .seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}

  .existing{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .exrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
  .exrow .x{margin-left:auto;color:var(--danger);font-weight:700;font-size:20px;width:30px;height:30px;display:grid;place-items:center}

  .toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  /* day selector */
  .daysel{display:flex;gap:6px;margin:2px 0 6px}
  .daysel button{flex:1;padding:8px 2px 6px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--muted);line-height:1.1}
  .daysel button small{display:block;font-size:10.5px;font-weight:600;margin-top:2px;opacity:.8}
  .daysel button.today{border-color:var(--brand);color:var(--brand)}
  .daysel button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .daysel button.on small{opacity:.95}
  /* roster blocks */
  .rblock{margin-top:14px;overflow:hidden}
  .rblock .rhead{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;padding:13px 14px 11px;border-bottom:1px solid var(--line)}
  .rblock .rhead .time{margin-left:auto;color:var(--muted);font-weight:600;font-size:12.5px}
  .rrow{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:0}
  .rrow .rlabel{width:74px;flex:0 0 auto;font-weight:700;font-size:14px;padding-top:5px}
  .rrow .rlabel small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:1px}
  .rchips{display:flex;flex-wrap:wrap;gap:7px;flex:1;align-items:flex-start}
  .nchip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}
  .nchip:active{transform:scale(.96)}
  .nchip.bike{background:#FFF1D9;border-color:#F0D9A8}
  .nchip .tt{font-size:10.5px;color:var(--muted);font-weight:700;background:#fff;padding:1px 5px;border-radius:6px;margin-left:2px}
  .addp{padding:7px 12px;border-radius:999px;border:1px dashed var(--brand);color:var(--brand);font-weight:700;font-size:13px;background:transparent}
  .addp:active{background:var(--brand-soft)}
  .bikepick{background:var(--surface-2)}
  .bikebtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--brand-ink);font-weight:700;padding:7px 12px;border:1px solid #E7C9B2;border-radius:11px;background:var(--brand-soft)}
  .req-tbl{width:100%;border-collapse:collapse}
  .req-tbl th{font-size:12px;color:var(--muted);font-weight:700;padding:0 4px 8px;text-align:center}
  .req-tbl th:first-child{text-align:left}
  .req-tbl td{padding:4px}
  .req-tbl td.rq-per{font-size:13.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;height:48px}
  .req-tbl .rq-in{width:100%;min-width:52px;height:44px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:700;font-size:16px}
  .req-tbl .rq-in:focus{outline:none;border-color:var(--brand);background:#fff}
  .danger-text{color:var(--danger)}
  .link{color:var(--brand);font-weight:700}
  hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>

<div id="app">
  <header class="top">
    <div class="cup">☕️</div>
    <div class="ttl"><b id="brandName">Xếp Ca</b><span id="brandSub">Cơ sở 3</span></div>
    <button class="icon-btn" id="btnSettings" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="view" id="v-today"></section>
    <section class="view active" id="v-week"></section>
    <section class="view" id="v-staff"></section>
    <section class="view" id="v-leave"></section>
    <section class="view" id="v-settings"></section>
  </main>
</div>

<div class="fab" id="fab" style="display:none"><button id="fabBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>

<nav class="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Hôm nay</span></button>
  <button data-tab="week" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg><span>Lịch tuần</span></button>
  <button data-tab="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/></svg><span>Nhân viên</span></button>
  <button data-tab="leave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg><span>Nghỉ/Sớm</span></button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Xếp Ca — quản lý ca cà phê (chạy offline, lưu trong máy)
   ============================================================ */
const DOW = ['T2','T3','T4','T5','T6','T7','CN'];
const DOW_FULL = ['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const STORE_KEY = 'xepca_v1';

/* ---------- default data ---------- */
function defaultData(){
  return {
    settings:{
      branch:'Cơ sở 3',

      minShifts:0,                        // số ca tối thiểu mỗi người/tuần (0 = tắt)
      positions:['Pha chế','Phục vụ'],   // Giữ xe là 1 phục vụ được đánh dấu (flag bike)

let DB = load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(STORE_KEY));
    if(r&&r.settings){ return migrate(r); }
  }catch(e){}
  return defaultData();
}
function migrate(r){
  const d=defaultData();
  r.settings=r.settings||{};
  if(!r.settings.positions||!r.settings.positions.length) r.settings.positions=d.settings.positions;
  if(!r.settings.req) r.settings.req=d.settings.req;
  if(r.settings.sheetUrl==null) r.settings.sheetUrl='';
  if(r.settings.minShifts==null) r.settings.minShifts=0;
  // Giữ xe không còn là vị trí -> chuyển thành Phục vụ + flag giữ xe
  if(r.settings.positions.includes('Giữ xe')){
    r.settings.positions=r.settings.positions.filter(p=>p!=='Giữ xe');
    if(!r.settings.positions.includes('Phục vụ')) r.settings.positions.push('Phục vụ');
    Object.values(r.settings.req||{}).forEach(o=>{ if(o&&'Giữ xe' in o) delete o['Giữ xe']; });
    Object.values(r.schedule||{}).forEach(wk=>Object.values(wk).forEach(days=>Object.values(days).forEach(arr=>{
      arr.forEach(c=>{ if(c.pos==='Giữ xe'){ c.pos='Phục vụ'; c.bike=true; } });
    })));
  }
  r.shiftTypes=r.shiftTypes||d.shiftTypes;
  r.employees=r.employees||[];
  r.schedule=r.schedule||{};
  r.leaves=r.leaves||[];
  r.early=r.early||[];
  r.availability=r.availability||{};   // weekKey -> empId -> {dayIdx:[periodKeys]}
  return r;
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- date helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYMD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function dmShort(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1);}
let curMonday = mondayOf(new Date());

/* ---------- shift time parsing (for period coverage) ---------- */
function parseTime(t){ // '7h', '12h30', '00h'
  t=t.trim(); const m=t.match(/(\d{1,2})h(\d{0,2})/); if(!m)return null;
  let h=+m[1], mm=m[2]?+m[2]:0; if(h===0)h=24; return h*60+mm;
}
function shiftRange(st){
  const p=st.label.split('-'); if(p.length!==2)return null;
  const a=parseTime(p[0]), b=parseTime(p[1]); if(a==null||b==null)return null;
  return [a,b];
}
// periods: morning 7:00-12:30, afternoon 12:30-17:30, evening 17:30-24:00
const PERIODS=[
  {key:'m', name:'Sáng', a:420, b:750, cls:'m'},
  {key:'a', name:'Chiều', a:750, b:1050, cls:'a'},
  {key:'e', name:'Tối', a:1050, b:1440, cls:'e'}
];
function coveredPeriods(st){
  const r=shiftRange(st); if(!r)return [];
  return PERIODS.filter(p=> r[0]<p.b && r[1]>p.a).map(p=>p.key);
}
function shiftClass(st){ // color class by span
  const cov=coveredPeriods(st);
  if(cov.length>=2) return 'full';
  if(cov.length===1) return cov[0];
  return 'off';
}
// khung giờ chuẩn cho một buổi (dùng khi nhập đăng ký): chọn ca phủ đúng buổi đó, dài nhất
function canonicalShiftFor(pk){
  const cands=DB.shiftTypes.filter(t=>{const c=coveredPeriods(t);return c.length===1&&c[0]===pk;});
  if(!cands.length){ const any=DB.shiftTypes.filter(t=>coveredPeriods(t).includes(pk)); if(any.length) return any.sort((a,b)=>b.hours-a.hours)[0]; return null; }
  return cands.sort((a,b)=>b.hours-a.hours)[0];
}
function typeById(id){return DB.shiftTypes.find(s=>s.id===id);}
function empById(id){return DB.employees.find(e=>e.id===id);}
function initials(name){const p=name.trim().split(/\s+/);return (p.length>1?p[p.length-2][0]+p[p.length-1][0]:name.slice(0,2)).toUpperCase();}

/* ---------- schedule access ---------- */
function weekKey(monday){return ymd(monday);}
function cellShifts(monday,empId,day){
  const wk=DB.schedule[weekKey(monday)]; if(!wk)return[];
  const e=wk[empId]; if(!e)return[];
  return e[day]||[];
}
function setCell(monday,empId,day,arr){
  const k=weekKey(monday);
  DB.schedule[k]=DB.schedule[k]||{};
  DB.schedule[k][empId]=DB.schedule[k][empId]||{};
  if(arr&&arr.length) DB.schedule[k][empId][day]=arr;
  else { delete DB.schedule[k][empId][day]; }
  save();
}
function weekHours(monday,empId){
  let h=0;
  for(let d=0;d<7;d++) cellShifts(monday,empId,d).forEach(c=>{const t=typeById(c.typeId);if(t)h+=t.hours;});
  return h;
}
function onLeave(dateStr,empId){ return DB.leaves.some(l=>l.empId===empId && dateStr>=l.date && dateStr<=(l.dateEnd||l.date)); }

function renderToday(){
  const el=document.getElementById('v-today');
  const now=new Date(); const today=ymd(now);
  const mon=mondayOf(now); const dayIdx=(now.getDay()+6)%7;
  // gather workers today
  const working=[];
  DB.employees.forEach(e=>{
    cellShifts(mon,e.id,dayIdx).forEach(c=>{const t=typeById(c.typeId);if(t)working.push({e,c,t});});
  });
  const earlyToday=DB.early.filter(x=>x.date===today);
  const leaveToday=DB.leaves.filter(l=>today>=l.date && today<=(l.dateEnd||l.date));

  let html=`<div class="today-hero">
    <div class="dow">${DOW_FULL[dayIdx]}</div>
    <div class="date">${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}</div>
    <div class="stats">
      <div><b class="tnum">${working.length}</b><span>lượt ca hôm nay</span></div>
      <div><b class="tnum">${earlyToday.length}</b><span>xin về sớm</span></div>
      <div><b class="tnum">${leaveToday.length}</b><span>nghỉ hôm nay</span></div>
    </div></div>`;

  if(DB.employees.length===0){
    html+=`<div class="empty" style="margin-top:20px"><div class="big">👋</div>Chưa có nhân viên nào.<br>Vào tab <b>Nhân viên</b> để thêm người của Cơ sở 3.</div>`;
    el.innerHTML=html; return;
  }

  // warnings
  const warns=dayWarnings(mon,dayIdx,today);
  if(warns.length){
    html+=`<div class="warnbox"><h3>⚠️ Cần chú ý hôm nay</h3><ul>${warns.map(w=>`<li>${w}</li>`).join('')}</ul></div>`;
  }

  // group by period
  PERIODS.forEach(p=>{
    const list=working.filter(w=>coveredPeriods(w.t).includes(p.key));
    if(!list.length)return;
    html+=`<div class="period-block"><div class="ph"><span class="dot c-${p.cls}"></span>Ca ${p.name} <span class="muted" style="font-weight:600">· ${list.length} người</span></div><div class="card">`;
    list.forEach(w=>{
      const early=earlyToday.find(x=>x.empId===w.e.id);
      html+=`<div class="worker"><div class="av">${initials(w.e.name)}</div>
        <div class="info"><b>${w.e.name}</b><span>${w.t.label} · ${w.c.pos||'—'}${w.c.bike?' · 🛵 giữ xe':''}</span></div>
        ${early?`<span class="pill bg-full">Về ${early.time}</span>`:''}</div>`;
    });
    html+=`</div></div>`;
  });

  if(working.length===0){
    html+=`<div class="empty" style="margin-top:16px"><div class="big">🌤️</div>Chưa xếp ca cho hôm nay.<br>Vào <b>Lịch tuần</b> để xếp ca.</div>`;
  }
  el.innerHTML=html;
}
// đếm số người theo vị trí trong một buổi của một ngày -> {role:count}
function staffCount(mon,dayIdx,pk){
  const m={};
  DB.employees.forEach(e=>{
    cellShifts(mon,e.id,dayIdx).forEach(c=>{
      const t=typeById(c.typeId);
      if(t&&coveredPeriods(t).includes(pk)){ const r=c.pos||'(chưa rõ)'; m[r]=(m[r]||0)+1; }
    });
  });
  return m;
}
function dayWarnings(mon,dayIdx,dateStr){
  const w=[];
  PERIODS.forEach(p=>{
    const req=DB.settings.req[p.key]||{};
    const have=staffCount(mon,dayIdx,p.key);
    // chỉ báo khi buổi này đã có người (đã xếp) nhưng thiếu vị trí nào đó
    const total=Object.values(have).reduce((a,b)=>a+b,0);
    if(!total) return;
    Object.keys(req).forEach(role=>{
      const need=req[role], got=have[role]||0;
      if(got<need) w.push(`Ca <b>${p.name}</b> thiếu <b>${role}</b>: ${got}/${need}.`);
    });
  });
  DB.employees.forEach(e=>{
    if(onLeave(dateStr,e.id) && cellShifts(mon,e.id,dayIdx).length)
      w.push(`<b>${e.name}</b> đã xin nghỉ nhưng vẫn được xếp ca.`);
  });
  return w;
}

    </div>

  </div>`;

    const date=addDays(mon,d); const isT=ymd(date)===todayStr;
    html+=`<button class="${d===selDay?'on':''} ${isT?'today':''}" data-day="${d}">${DOW[d]}<small>${dmShort(date)}</small></button>`;
  }
  html+=`</div>`;

  if(DB.employees.length===0){
    html+=`<div class="empty" style="padding-bottom:16px"><div class="big">📋</div>Chưa có nhân viên.<br>Nhập từ Google Sheet đăng ký (tự tạo nhân viên),<br>hoặc thêm tay ở tab <b>Nhân viên</b>.</div>`;

  // từng buổi
  PERIODS.forEach(p=>{
    html+=renderPeriodBlock(mon,selDay,p);
  });

  // actions
  const hasAvail=DB.availability&&DB.availability[weekKey(mon)]&&Object.keys(DB.availability[weekKey(mon)]).length;
  if(hasAvail) html+=`<button class="btn wide" id="btnAuto" style="margin-top:16px;background:#2E7D5B"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Tự xếp lại ca (cân bằng)</button>`;
  html+=`<button class="btn ghost wide" id="btnCopy" style="margin-top:${hasAvail?10:16}px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Chép lịch tuần trước</button>
  <button class="btn wide" id="btnExport" style="margin-top:10px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>Xuất ảnh gửi Zalo</button>`;
  html+=importActionsHTML();

  el.innerHTML=html;
  bindWeekNav(); bindDaySel(); bindImportActions();
  bindRoster();
  const ba=document.getElementById('btnAuto'); if(ba) ba.onclick=autoScheduleBtn;
  document.getElementById('btnCopy').onclick=copyPrevWeek;
  document.getElementById('btnExport').onclick=exportWeekImage;
}
function bindDaySel(){
  document.querySelectorAll('.daysel button').forEach(b=>b.onclick=()=>{selDay=+b.dataset.day;renderWeek();});
}
function renderPeriodBlock(mon,day,p){
  const canon=canonicalShiftFor(p.key);
  // gom theo vị trí
  const byRole={}; DB.settings.positions.forEach(r=>byRole[r]=[]);
  DB.employees.forEach(e=>{
    cellShifts(mon,e.id,day).forEach((c,ci)=>{
      const st=typeById(c.typeId);
      if(st&&coveredPeriods(st).includes(p.key)){ (byRole[c.pos]=byRole[c.pos]||[]).push({e,c,st,ci}); }
    });
  });
  const req=DB.settings.req[p.key]||{};
  let h=`<div class="rblock card"><div class="rhead"><span class="dot c-${p.cls}"></span>Ca ${p.name}<span class="time">${canon?canon.label:''}</span></div>`;
  DB.settings.positions.forEach(role=>{
    const list=byRole[role]||[];
    const need=req[role]||0;
    const short=need&&list.length<need;
    h+=`<div class="rrow"><div class="rlabel">${role}<small class="${short?'danger-text':''}">${list.length}${need?'/'+need:''} người</small></div><div class="rchips">`;
    list.forEach(x=>{
      const nonCanon=canon&&x.c.typeId!==canon.id;
      const bike=x.c.bike?'<span class="bk">🛵</span>':'';
      h+=`<button class="nchip ${x.c.bike?'bike':''}" data-act="chip" data-day="${day}" data-emp="${x.e.id}" data-ci="${x.ci}">${bike}${esc(x.e.name)}${nonCanon?`<span class="tt">${x.st.label}</span>`:''}</button>`;
    });
    h+=`<button class="addp" data-act="add" data-day="${day}" data-pk="${p.key}" data-role="${esc(role)}">+ Thêm</button></div></div>`;
  });
  // chọn người giữ xe (trong Phục vụ)
  if(byRole['Phục vụ']&&byRole['Phục vụ'].length){
    const bikePerson=byRole['Phục vụ'].find(x=>x.c.bike);
    h+=`<div class="rrow bikepick"><div class="rlabel">🛵 Giữ xe</div><div class="rchips"><button class="bikebtn" data-act="bike" data-day="${day}" data-pk="${p.key}">${bikePerson?esc(bikePerson.e.name):'Chọn người ra giữ xe'} ▾</button></div></div>`;
  }
  h+=`</div>`;
  return h;
}
function bindRoster(){
  document.querySelectorAll('#v-week [data-act]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.act;
      if(a==='chip') openAssignSheet(+b.dataset.day,b.dataset.emp,+b.dataset.ci);
      else if(a==='add') openAddSheet(+b.dataset.day,b.dataset.pk,b.dataset.role);
      else if(a==='bike') openBikeSheet(+b.dataset.day,b.dataset.pk);
    };
  });
}
/* --- thêm người vào 1 buổi + vị trí --- */
function openAddSheet(day,pk,role){
  const mon=curMonday; const canon=canonicalShiftFor(pk); const wk=weekKey(mon);
  const p=PERIODS.find(x=>x.key===pk);
  const av=(DB.availability&&DB.availability[wk])||{};
  const isFree=id=> av[id] && av[id][day] && av[id][day].includes(pk);
  // ai chưa có ca phủ buổi này
  let list=DB.employees.filter(e=>!cellShifts(mon,e.id,day).some(c=>{const t=typeById(c.typeId);return t&&coveredPeriods(t).includes(pk);}));
  // xếp: đúng vị trí + đã đăng ký rảnh lên đầu
  list.sort((a,b)=>{
    const af=(isFree(a.id)?0:1)+(a.pos===role?0:2), bf=(isFree(b.id)?0:1)+(b.pos===role?0:2);
    return af-bf;
  });
  let html=`<div class="grip"></div><h2>Thêm ${esc(role)} · Ca ${p.name}</h2><div class="sub">${DOW_FULL[(addDays(mon,day).getDay()+6)%7]}, ${dmShort(addDays(mon,day))} · ${canon?canon.label:''}</div>`;
  if(!list.length) html+=`<div class="empty" style="padding:18px">Mọi nhân viên đều đã có ca buổi này.</div>`;
  else{ html+=`<div class="existing">`+list.map(e=>{
      const leave=onLeave(ymd(addDays(mon,day)),e.id); const free=isFree(e.id);
      const sub=leave?'<span class="danger-text">🌙 đã xin nghỉ</span>':(e.pos||'');
      return `<button class="exrow" data-pick="${e.id}" style="width:100%;text-align:left"><div class="av" style="width:32px;height:32px;font-size:12px;border-radius:50%;background:${free?'#D8F0EC':'var(--brand-soft)'};color:var(--brand-ink);display:grid;place-items:center;font-weight:800">${initials(e.name)}</div><div style="flex:1"><b>${esc(e.name)}</b><div class="muted" style="font-size:12px">${sub}</div></div>${free?'<span class="pill bg-a">✓ rảnh</span>':''}</button>`;
    }).join('')+`</div>`; }
  document.getElementById('sheet').innerHTML=html;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const e=empById(b.dataset.pick); const arr=cellShifts(mon,e.id,day).slice();
    arr.push({typeId:canon.id,pos:role});
    setCell(mon,e.id,day,arr);
    closeSheet(); toast('Đã thêm '+e.name); renderWeek();
  });
  openSheet();
}
/* --- sửa 1 ca của 1 người --- */
function openAssignSheet(day,empId,ci){
  const mon=curMonday; const e=empById(empId);
  const arr=cellShifts(mon,e.id,day).slice(); const c=arr[ci]; if(!c)return;
  const cur=typeById(c.typeId);
  const covers=DB.shiftTypes.filter(t=>{const cp=coveredPeriods(t); return cur?cp.some(k=>coveredPeriods(cur).includes(k)):true;});

/* ============================================================
   NHẬP ĐĂNG KÝ CA (từ Google Sheet xuất CSV)
   ============================================================ */
function noAccent(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();}
function parseCSV(text){
  text=text.replace(/^﻿/,''); const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch==='\r'){} else cur+=ch; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const DOW_TOKEN={t2:0,t3:1,t4:2,t5:3,t6:4,t7:5,cn:6};
function colMeta(header){
  const h=noAccent(header);
  let day=null; const dm=h.match(/\b(t[2-7]|cn)\b/); if(dm) day=DOW_TOKEN[dm[1]];
  let pk=null; if(/sang/.test(h))pk='m'; else if(/chieu/.test(h))pk='a'; else if(/toi/.test(h))pk='e';
  return (day!=null&&pk)?{day,pk}:null;
}
function isClaimed(v){ const n=noAccent(v); return n!=='' && !['0','off','nghi','x0','-'].includes(n); }
function matchRole(v){
  const n=noAccent(v);
  const found=DB.settings.positions.find(p=>noAccent(p)===n);
  if(found)return found;
  if(/pha\s*che/.test(n))return 'Pha chế';
  if(/giu\s*xe|phuc\s*vu/.test(n))return 'Phục vụ';   // giữ xe gộp vào phục vụ
  return v.trim()||'Phục vụ';
}
function onImportFile(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ processRegistration(rd.result); }catch(e){ alert('Không đọc được file này. Hãy chắc bạn đã tải Google Sheet ở dạng CSV.\n\n('+e.message+')'); } };
  rd.readAsText(f,'utf-8');
  ev.target.value='';
}
// build link CSV (gviz) từ link Google Sheet bình thường
function sheetCsvUrl(link){
  const m=String(link).match(/\/spreadsheets\/d\/([a-zA-Z0-9\-_]+)/); if(!m)return null;
  let gid='0'; const g=String(link).match(/[#&?]gid=(\d+)/); if(g)gid=g[1];
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${gid}`;
}
async function syncFromSheet(){
  const link=(DB.settings.sheetUrl||'').trim();
  if(!link){ toast('Chưa có link Sheet — vào Cài đặt để dán'); go('settings'); return; }
  const url=sheetCsvUrl(link);
  if(!url){ toast('Link Google Sheet không hợp lệ'); return; }
  const btn=document.getElementById('btnSync'); if(btn){btn.disabled=true;btn.style.opacity=.6;btn.innerHTML='Đang tải từ Google Sheet…';}
  let text;
  try{
    const r=await fetch(url+'&_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    text=await r.text();
  }catch(e){
    alert('Không tải được từ Google Sheet.\n\nKiểm tra: có mạng chưa, và Sheet đã đặt chia sẻ "Bất kỳ ai có đường liên kết".\n\n('+e.message+')');
    renderWeek(); return;
  }
  try{ processRegistration(text); }
  catch(e){ alert('Lấy được dữ liệu nhưng chưa đọc được: '+e.message); renderWeek(); }
}

function processRegistration(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c&&c.trim()!==''));
  // tìm dòng tiêu đề: ô nào là "Tên" (ở bất kỳ cột nào)
  let hi=-1, nameCol=0;
  const isName=x=>['ten','ho ten','ho va ten','ten nv','ten nhan vien'].includes(noAccent(x||''));
  for(let i=0;i<rows.length;i++){ const c=rows[i].findIndex(isName); if(c>=0){hi=i;nameCol=c;break;} }
  if(hi<0) throw new Error('Không thấy cột "Tên" trong file. Kiểm tra lại đúng bảng đăng ký.');
  const header=rows[hi];
  let roleCol=header.findIndex(c=>/vi\s*tri/.test(noAccent(c)));
  if(roleCol<0) roleCol=nameCol+1;
  const metas=header.map((h,i)=> (i===nameCol||i===roleCol)?null:colMeta(h) );
  // gom đăng ký theo thứ tự dòng
  const people=[];
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]; const name=(row[nameCol]||'').trim(); if(!name||isName(name)) continue;
    const role=matchRole(row[roleCol]||'');
    const claims=[];
    metas.forEach((m,i)=>{ if(m && isClaimed(row[i]||'')) claims.push(m); });
    if(claims.length) people.push({name,role,claims});
  }
  if(!people.length) throw new Error('Chưa có ai đăng ký ca trong file');
  showImportPreview(people);
}
function showImportPreview(people){
  const totalClaims=people.reduce((a,p)=>a+p.claims.length,0);
  const mon=curMonday;
  let html=`<div class="grip"></div><h2>Nhận đăng ký rảnh</h2>
    <div class="sub">Tuần ${dmShort(mon)} – ${dmShort(addDays(mon,6))} · ${people.length} người · ${totalClaims} buổi rảnh</div>
    <div class="swapbar" style="background:var(--brand-soft);border-color:#E7C9B2;color:var(--brand-ink)">
      App sẽ tự xếp ca cân bằng từ các buổi rảnh (đủ định mức, chia đều, ưu tiên người ít ca). Bạn chỉnh tay được sau.</div>
    <div class="existing" style="max-height:34vh;overflow:auto">`;
  people.forEach(p=>{ html+=`<div class="exrow"><div class="av" style="width:30px;height:30px;font-size:12px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800">${initials(p.name)}</div>
    <div><b>${esc(p.name)}</b><div class="muted" style="font-size:12px">${esc(p.role)} · rảnh ${p.claims.length} buổi</div></div></div>`; });
  html+=`</div>
    <button class="btn wide" id="doImport" style="margin-top:12px">Lưu đăng ký & tự xếp ca</button>
    <button class="btn ghost wide" id="cancelImport" style="margin-top:10px">Huỷ</button>`;
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('cancelImport').onclick=closeSheet;
  document.getElementById('doImport').onclick=()=>applyRegistration(people);
  openSheet();
}
function applyRegistration(people){
  const mon=curMonday, wk=weekKey(mon);
  // 1) khớp / tạo nhân viên (cập nhật vị trí theo form)
  const created=[];
  people.forEach(p=>{
    let e=DB.employees.find(x=>noAccent(x.name)===noAccent(p.name));
    if(!e){ e={id:uid(),name:p.name.trim(),rate:0,phone:'',pos:p.role}; DB.employees.push(e); created.push(e.name); }
    else if(p.role) e.pos=p.role;
    p.empId=e.id;
  });
  // 2) lưu buổi rảnh (availability) cho tuần
  const avail={};
  people.forEach(p=>{ avail[p.empId]=avail[p.empId]||{};
    p.claims.forEach(c=>{ const arr=(avail[p.empId][c.day]=avail[p.empId][c.day]||[]); if(!arr.includes(c.pk)) arr.push(c.pk); });
  });
  DB.availability=DB.availability||{}; DB.availability[wk]=avail;
  save();
  // 3) tự xếp cân bằng ngay
  const res=runAutoSchedule(mon);
  closeSheet();
  showScheduleResult({created, ...res});
  renderWeek();
}
/* ---------- thuật toán xếp ca cân bằng từ buổi rảnh ---------- */
function runAutoSchedule(mon){
  const wk=weekKey(mon); const avail=DB.availability[wk]||{};
  const load={}; DB.employees.forEach(e=>load[e.id]=0);
  const minS=DB.settings.minShifts||0;
  const newWeek={}; const gaps=[];
  const isFree=(id,d,pk)=> avail[id] && avail[id][d] && avail[id][d].includes(pk);
  const busyPeriod=(id,d,pk)=> (newWeek[id]&&newWeek[id][d]||[]).some(c=>coveredPeriods(typeById(c.typeId)).includes(pk));
  // hôm qua có làm ca tối không (để tránh tối -> sáng hôm sau)
  const lateYesterday=(id,d)=> d>0 && (newWeek[id]&&newWeek[id][d-1]||[]).some(c=>coveredPeriods(typeById(c.typeId)).includes('e'));
  for(let d=0; d<7; d++){
    const ds=ymd(addDays(mon,d));
    PERIODS.forEach(p=>{
      const req=DB.settings.req[p.key]||{};
      DB.settings.positions.forEach(role=>{
        const need=req[role]||0; let filled=0;
        for(let k=0;k<need;k++){
          const cands=DB.employees.filter(e=> e.pos===role && !onLeave(ds,e.id) && isFree(e.id,d,p.key) && !busyPeriod(e.id,d,p.key));
          if(!cands.length) break;
          // ưu tiên: tránh vừa ca tối hôm qua -> chưa đủ ca tối thiểu -> ít ca nhất
          cands.sort((a,b)=>{
            if(p.key==='m'){ const ar=lateYesterday(a.id,d)?1:0, br=lateYesterday(b.id,d)?1:0; if(ar!==br)return ar-br; }
            const am=load[a.id]<minS?0:1, bm=load[b.id]<minS?0:1; if(am!==bm)return am-bm;
            return load[a.id]-load[b.id];
          });
          const pick=cands[0]; const t=canonicalShiftFor(p.key);
          newWeek[pick.id]=newWeek[pick.id]||{}; (newWeek[pick.id][d]=newWeek[pick.id][d]||[]).push({typeId:t.id,pos:role});
          load[pick.id]++; filled++;
        }
        if(filled<need) gaps.push({day:d,pk:p.key,role,filled,need});
      });
    });
  }
  DB.schedule[wk]=newWeek; save();
  const under=DB.employees.filter(e=>minS>0 && load[e.id]<minS).map(e=>({name:e.name,got:load[e.id]}));
  return {gaps, under, load, minS};
}
function autoScheduleBtn(){
  const mon=curMonday, wk=weekKey(mon);
  if(!DB.availability||!DB.availability[wk]||!Object.keys(DB.availability[wk]).length){ toast('Chưa có đăng ký rảnh — Nhập/Đồng bộ trước'); return; }
  if(!confirm('Tự xếp lại lịch tuần này từ đăng ký rảnh? Các chỉnh tay hiện có sẽ bị thay.')) return;
  const res=runAutoSchedule(mon); showScheduleResult(res); renderWeek();

/* ---------- export week as image ---------- */
function exportWeekImage(){
  const mon=curMonday, sun=addDays(mon,6);
  const emps=DB.employees;
  if(!emps.length){toast('Chưa có nhân viên');return;}
  const scale=2;
  const nameW=120, colW=118, headH=70, rowH=64, titleH=76, padX=18, footH=40;
  const W=nameW+colW*7+padX*2;
  const H=titleH+headH+rowH*emps.length+footH+padX;
  const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale;
  const x=cv.getContext('2d'); x.scale(scale,scale);
  const col={bg:'#F4ECE1',surf:'#FFFDF9',ink:'#2E211B',muted:'#8C7C6E',line:'#E7DBCB',brand:'#A9541F',
    m:'#FBEBD3',a:'#D8F0EC',e:'#E9E2FA',full:'#F6DFD3',off:'#ECE6DE',
    mT:'#8a5410',aT:'#186b60',eT:'#4b34a0',fullT:'#8f3a17',offT:'#7a6d5f'};
  x.fillStyle=col.bg; x.fillRect(0,0,W,H);
  // title
  x.fillStyle=col.brand; x.font='800 24px -apple-system,system-ui,sans-serif'; x.textBaseline='top';
  x.fillText('☕ Lịch làm — '+(DB.settings.branch||''),padX,padX);
  x.fillStyle=col.muted; x.font='600 15px -apple-system,system-ui,sans-serif';
  x.fillText(`Tuần ${dmShort(mon)} – ${dmShort(sun)}`,padX,padX+34);
  const ox=padX, oy=titleH;
  // header
  x.fillStyle=col.surf; x.fillRect(ox,oy,nameW+colW*7,headH);
  const todayStr=ymd(new Date());
  for(let d=0;d<7;d++){
    const date=addDays(mon,d); const cx=ox+nameW+colW*d;
    if(ymd(date)===todayStr){ x.fillStyle='#F3E1D2'; x.fillRect(cx,oy,colW,headH); }
    x.fillStyle=col.muted; x.font='700 14px system-ui,sans-serif'; x.textAlign='center';
    x.fillText(DOW[d],cx+colW/2,oy+12);
    x.fillStyle=col.ink; x.font='700 17px system-ui,sans-serif';
    x.fillText(dmShort(date),cx+colW/2,oy+34);
  }
  x.textAlign='left';
  // rows
  emps.forEach((e,r)=>{
    const ry=oy+headH+rowH*r;
    x.fillStyle=r%2?col.surf:'#FBF5EC'; x.fillRect(ox,ry,nameW+colW*7,rowH);
    x.fillStyle=col.ink; x.font='700 15px system-ui,sans-serif';
    x.fillText(trunc(x,e.name,nameW-16),ox+10,ry+12);
    const wh=weekHours(mon,e.id);
    x.fillStyle=col.muted; x.font='600 12px system-ui,sans-serif';
    x.fillText(fmtH(wh)+(e.rate?' · '+money(wh*e.rate):''),ox+10,ry+34);
    for(let d=0;d<7;d++){
      const shifts=cellShifts(mon,e.id,d); const cx=ox+nameW+colW*d;
      let cy=ry+8;
      shifts.slice(0,2).forEach(c=>{
        const t=typeById(c.typeId); if(!t)return;
        const cls=shiftClass(t);
        x.fillStyle=col[cls]; roundRect(x,cx+6,cy,colW-12,shifts.length>1?22:44,7); x.fill();
        x.fillStyle=col[cls+'T']; x.font='700 12px system-ui,sans-serif';
        x.fillText(t.label,cx+12,cy+ (shifts.length>1?5:6));
        if(shifts.length===1&&c.pos){x.font='600 11px system-ui,sans-serif';x.fillText(c.pos,cx+12,cy+24);}
        cy+= shifts.length>1?26:0;
      });
    }
  });
  // grid lines
  x.strokeStyle=col.line; x.lineWidth=1;
  for(let d=0;d<=7;d++){const cx=ox+nameW+colW*d;x.beginPath();x.moveTo(cx,oy);x.lineTo(cx,oy+headH+rowH*emps.length);x.stroke();}
  for(let r=0;r<=emps.length;r++){const ry=oy+headH+rowH*r;x.beginPath();x.moveTo(ox,ry);x.lineTo(ox+nameW+colW*7,ry);x.stroke();}
  x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+nameW+colW*7,oy);x.stroke();
  // footer
  x.fillStyle=col.muted; x.font='600 12px system-ui,sans-serif';
  x.fillText('Tạo bằng app Xếp Ca',ox,oy+headH+rowH*emps.length+12);

  cv.toBlob(blob=>{
    const file=new File([blob],`lich-tuan-${dmShort(mon).replace('/','-')}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Lịch làm tuần'}).catch(()=>{});
    }else{
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
      toast('Đã tải ảnh về máy');
    }
  },'image/png');
}
function trunc(x,s,max){ if(x.measureText(s).width<=max)return s; while(s.length&&x.measureText(s+'…').width>max)s=s.slice(0,-1); return s+'…'; }
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

      <input type="file" id="restoreFile" accept="application/json" style="display:none">
    </div>

    <div class="sec-title">Khác</div>
    <div class="card pad">
      <button class="btn ghost wide danger-text" id="btnReset">Xoá toàn bộ dữ liệu</button>
    </div>
    <p class="muted" style="text-align:center;font-size:12px;margin:22px 0 8px">Xếp Ca · lưu offline trên máy</p>`;
  el.innerHTML=html;

  document.getElementById('setBranch').onchange=ev=>{DB.settings.branch=ev.target.value.trim()||'Cơ sở 3';save();render();};
  document.getElementById('setSheet').onchange=ev=>{DB.settings.sheetUrl=ev.target.value.trim();save();};
  document.querySelectorAll('.rq-in').forEach(inp=>inp.onchange=ev=>{
    const pk=ev.target.dataset.pk, role=ev.target.dataset.role;
    DB.settings.req[pk]=DB.settings.req[pk]||{};
    DB.settings.req[pk][role]=Math.max(0,parseInt(ev.target.value)||0);
    save();
  });
  document.getElementById('setMinShifts').onchange=ev=>{DB.settings.minShifts=Math.max(0,parseInt(ev.target.value)||0);save();};
  document.getElementById('setPos').onchange=ev=>{const arr=ev.target.value.split(',').map(s=>s.trim()).filter(Boolean);if(arr.length){DB.settings.positions=arr;save();render();}};
  document.querySelectorAll('[data-editshift]').forEach(b=>b.onclick=()=>openShiftTypeSheet(b.dataset.editshift));
  document.getElementById('addShiftType').onclick=()=>openShiftTypeSheet();
  document.getElementById('btnBackup').onclick=backup;
  document.getElementById('btnRestore').onclick=()=>document.getElementById('restoreFile').click();
  document.getElementById('restoreFile').onchange=restore;
  document.getElementById('btnReset').onclick=()=>{
    if(confirm('Xoá TẤT CẢ nhân viên, lịch, đơn nghỉ? Không thể hoàn tác.')){
      DB=defaultData();save();toast('Đã xoá sạch');go('week');
    }
  };
}
function openShiftTypeSheet(id){
  const t=id?typeById(id):null;
  let html=`<div class="grip"></div><h2>${t?'Sửa khung giờ':'Thêm khung giờ'}</h2>
    <div class="sub">Ghi dạng <b>7h-12h30</b>. App tự nhận biết sáng/chiều/tối.</div>
    <div class="field"><label>Khung giờ</label><input id="stLabel" value="${t?esc(t.label):''}" placeholder="VD: 7h-12h30"></div>
    <div class="field"><label>Số giờ công (để tính lương)</label><input id="stHours" inputmode="decimal" value="${t?t.hours:''}" placeholder="VD: 5.5"></div>
    <button class="btn wide" id="stSave">${t?'Lưu':'Thêm'}</button>`;
  if(t)html+=`<button class="btn ghost wide danger-text" id="stDel" style="margin-top:10px">Xoá khung giờ</button>`;
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('stSave').onclick=()=>{
    const label=document.getElementById('stLabel').value.trim();
    const hours=parseFloat(document.getElementById('stHours').value.replace(',','.'));
    if(!label||isNaN(hours)){toast('Nhập đủ khung giờ & số giờ');return;}
    if(t){Object.assign(t,{label,hours});}else{DB.shiftTypes.push({id:uid(),label,hours});}
    save();closeSheet();toast('Đã lưu');render();
  };
  if(t)document.getElementById('stDel').onclick=()=>{
    if(!confirm('Xoá khung giờ này?'))return;
    DB.shiftTypes=DB.shiftTypes.filter(z=>z.id!==t.id);save();closeSheet();toast('Đã xoá');render();
  };
  openSheet();
}
function backup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`xepca-saoluu-${ymd(new Date())}.json`; a.click();
  toast('Đã xuất file sao lưu');
}
function restore(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{ const d=JSON.parse(rd.result);
      if(!d.settings||!d.shiftTypes)throw 0;
      if(!confirm('Khôi phục sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;
      DB=d; save(); toast('Đã khôi phục'); go('week');
    }catch(e){ toast('File sao lưu không hợp lệ'); }
  };
  rd.readAsText(f);
  ev.target.value='';
}

/* ============================================================
   SHEET + TOAST helpers
   ============================================================ */
const backdrop=document.getElementById('backdrop'), sheet=document.getElementById('sheet');
function openSheet(){backdrop.classList.add('show');requestAnimationFrame(()=>sheet.classList.add('show'));}
function closeSheet(){sheet.classList.remove('show');backdrop.classList.remove('show');}
backdrop.onclick=closeSheet;
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){return Math.round(n).toLocaleString('vi-VN')+'đ';}
function fmtDate(s){const d=parseYMD(s);return `${DOW[(d.getDay()+6)%7]} ${dmShort(d)}`;}
function fmtRange(a,b){if(!b||b===a)return fmtDate(a);return `${dmShort(parseYMD(a))} → ${dmShort(parseYMD(b))}`;}

/* ---------- service worker + tự cập nhật ---------- */
if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return; refreshing=true; location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw&&nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage&&0; // bản mới sẵn sàng
      });
    });
    // kiểm tra bản mới mỗi khi mở lại app
    if(reg.update) reg.update();
  }).catch(()=>{});
}

/* ---------- go ---------- */
go('week');
</script>
