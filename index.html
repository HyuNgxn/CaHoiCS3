<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#8C2018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cá Hồi">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Cá Hồi — Xếp Ca</title>
<style>
  :root{
    --bg:#F5EDE7; --surface:#FFFCFA; --surface-2:#FBF3EF;
    --ink:#2B1C19; --muted:#8B7770; --line:#E9DAD3;
    --brand:#8C2018; --brand-ink:#6B1610; --brand-soft:#F7E2DE;
    --m:#E0912F; --a:#2E9E8F; --e:#7C5AC9; --full:#C4552A; --off:#B9AC9C;
    --danger:#C6362F; --danger-soft:#FBE4E2; --ok:#2E9E8F;
    --shadow:0 1px 2px rgba(46,33,27,.06),0 6px 20px rgba(46,33,27,.08);
    --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select{font-family:inherit;font-size:16px}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- App frame ---------- */
  #app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header.top{
    position:sticky;top:0;z-index:30;
    padding:calc(var(--safe-t) + 12px) 16px 12px;
    background:linear-gradient(180deg,rgba(244,236,225,.98),rgba(244,236,225,.86));
    backdrop-filter:saturate(1.4) blur(10px);
    display:flex;align-items:center;gap:12px;
  }
  header.top .cup{
    width:40px;height:40px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(160deg,#A82A1E,#6B1610);
    display:grid;place-items:center;box-shadow:var(--shadow)
  }
  header.top .ttl b{font-size:17px}
  header.top .ttl{flex:1;min-width:0}
  header.top .ttl b{display:block;font-size:19px;letter-spacing:-.02em}
  header.top .ttl span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  main{flex:1;padding:8px 16px 96px}
  .view{display:none}
  .view.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- Bottom tab bar ---------- */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;max-width:640px;margin:0 auto;
    padding:6px 6px calc(var(--safe-b) + 6px);
    background:rgba(255,253,249,.92);backdrop-filter:blur(14px) saturate(1.3);
    border-top:1px solid var(--line);
  }
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);border-radius:12px}
  nav.tabs button svg{width:24px;height:24px}
  nav.tabs button span{font-size:10.5px;font-weight:600;letter-spacing:-.01em}
  nav.tabs button.on{color:var(--brand)}
  nav.tabs button.on svg{transform:translateY(-1px)}

  /* ---------- Cards & bits ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .row{display:flex;align-items:center;gap:12px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)}
  .sec-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 10px}
  .sec-title:first-child{margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:34px 18px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--line);box-shadow:none}
  .btn.wide{width:100%}
  .btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:11px}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
  .icon-btn svg{width:20px;height:20px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px}
  .field input,.field select{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand);background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* period color chips */
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .c-m{background:var(--m)} .c-a{background:var(--a)} .c-e{background:var(--e)} .c-full{background:var(--full)} .c-off{background:var(--off)}
  .bg-m{background:#FBEBD3;color:#8a5410} .bg-a{background:#D8F0EC;color:#186b60} .bg-e{background:#E9E2FA;color:#4b34a0} .bg-full{background:#F6DFD3;color:#8f3a17} .bg-off{background:#ECE6DE;color:#7a6d5f}

  /* ---------- Week grid ---------- */
  .week-toolbar{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
  .weeknav{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .weeknav button{width:46px;height:46px;display:grid;place-items:center;color:var(--brand)}
  .weeknav .wlabel{flex:1;text-align:center;line-height:1.15;padding:4px}
  .weeknav .wlabel b{font-size:14.5px}
  .weeknav .wlabel span{display:block;font-size:11.5px;color:var(--muted)}

  .grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
  table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
  table.grid thead th{
    position:sticky;top:0;z-index:5;background:var(--surface-2);
    padding:8px 6px;text-align:center;min-width:96px;font-size:12px;color:var(--muted);font-weight:700
  }
  table.grid thead th b{display:block;color:var(--ink);font-size:14px}
  table.grid thead th.today{background:var(--brand-soft);color:var(--brand-ink)}
  table.grid thead th.today b{color:var(--brand-ink)}
  .name-col{
    position:sticky;left:0;z-index:6;background:var(--surface);
    min-width:104px;max-width:120px;padding:8px 10px;text-align:left;
    box-shadow:2px 0 0 var(--line)
  }
  thead .name-col{z-index:8;background:var(--surface-2)}
  .name-col .nm{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name-col .hrs{font-size:11.5px;color:var(--muted);margin-top:2px}
  td.cell{padding:5px;min-width:96px;height:56px;background:var(--surface)}
  td.cell:active{background:var(--surface-2)}
  td.cell.today{background:#FFFDF4}
  .chip{
    display:block;border-radius:9px;padding:5px 7px;margin-bottom:4px;font-size:12px;font-weight:700;line-height:1.15;text-align:left;position:relative
  }
  .chip .pos{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:1px}
  .chip.warn{box-shadow:0 0 0 2px var(--danger)}
  .chip .wbang{position:absolute;top:-6px;right:-4px;font-size:12px}
  .cell .add-hint{color:var(--line);font-size:20px;font-weight:400;text-align:center;line-height:46px}
  td.cell.sel{box-shadow:inset 0 0 0 3px var(--brand)}
  td.foot{position:sticky;bottom:0;background:var(--surface-2);font-size:11px;text-align:center;padding:6px 4px;color:var(--muted)}
  .name-col.footname{background:var(--surface-2)}

  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:12px 4px 0}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

  .swapbar{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid #E7C9B2;color:var(--brand-ink);padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:13.5px;font-weight:600}

  /* warnings banner */
  .warnbox{background:var(--danger-soft);border:1px solid #F0C4C0;border-radius:14px;padding:12px 14px;margin-top:14px}
  .warnbox h3{font-size:13px;color:var(--danger);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
  .warnbox ul{margin:0;padding-left:18px}
  .warnbox li{font-size:13.5px;margin:3px 0;color:#7d2622}

  /* ---------- dải tuần mini ---------- */
  .wstrip{display:flex;gap:3px;margin-top:4px}
  .wcell{flex:1;text-align:center;border-radius:7px;padding:3px 1px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
  .wcell .wd{display:block;font-size:9px;color:var(--muted);font-weight:700;line-height:1.2}
  .wcell .wv{display:block;font-size:11px;font-weight:800;line-height:1.3;white-space:nowrap}
  .wcell.hl{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
  .wcell .dash{color:var(--line)}
  .pl{display:inline-block;padding:0 1px;font-weight:800;border-radius:3px}
  .pl.pm{color:#a9660f}.pl.pa{color:#0f7a6c}.pl.pe{color:#5a3fb8}
  .legend .pl{background:var(--surface-2);padding:1px 5px;margin-right:4px}
  /* xem theo người */
  .erow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .erow:last-child{border-bottom:0}
  .erow:active{background:var(--surface-2)}
  .ename{width:96px;flex:0 0 auto;font-weight:700;font-size:13.5px;min-width:0}
  .ename small{display:block;color:var(--muted);font-weight:600;font-size:10.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .erow .wstrip{flex:1;margin-top:0}
  /* ---------- Today ---------- */
  .today-hero{background:linear-gradient(155deg,#A82A1E,#6B1610);color:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .today-hero .dow{font-size:13px;opacity:.85;font-weight:600}
  .today-hero .nowline{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:3px 0 12px;display:flex;align-items:center;gap:8px}
  .livedot{width:9px;height:9px;border-radius:50%;background:#7CE0A9;box-shadow:0 0 0 0 rgba(124,224,169,.7);animation:pulse 1.8s infinite;flex:0 0 auto}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,224,169,.7)}70%{box-shadow:0 0 0 9px rgba(124,224,169,0)}100%{box-shadow:0 0 0 0 rgba(124,224,169,0)}}
  .tblock{margin-top:10px;overflow:hidden;transition:opacity .2s}
  .tblock.dim{opacity:.5}
  .tblock.live{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft),var(--shadow)}
  .livetag{font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--brand);color:#fff;padding:3px 7px;border-radius:6px}
  .nm2 i.early{background:#F6DFD3;color:#8f3a17}
  .today-hero .date{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px}
  .today-hero .stats{display:flex;gap:18px}
  .today-hero .stats div b{display:block;font-size:22px;line-height:1}
  .today-hero .stats div span{font-size:11.5px;opacity:.85}
  .period-block{margin-top:14px}
  .period-block .ph{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-weight:700;font-size:14px}
  .worker{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .worker:last-child{border-bottom:0}
  .worker .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto}
  .worker .info{flex:1;min-width:0}
  .worker .info b{font-size:15px}
  .worker .info span{display:block;font-size:12.5px;color:var(--muted)}

  /* list items */
  .li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
  .li .info{flex:1;min-width:0}
  .li .info b{font-size:15.5px}
  .li .info span{display:block;font-size:12.5px;color:var(--muted)}
  .li .chev{color:var(--line)}

  .fab{position:fixed;right:calc(50% - 320px + 18px);bottom:calc(var(--safe-b) + 78px);z-index:35}
  @media(max-width:672px){.fab{right:18px}}
  .fab button{width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(169,84,31,.4)}
  .fab button svg{width:26px;height:26px}

  /* ---------- Sheet (modal) ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(30,20,15,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;
    background:var(--surface);border-radius:22px 22px 0 0;
    padding:8px 16px calc(var(--safe-b) + 18px);
    transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:90vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.2)
  }
  .sheet.show{transform:none}
  .grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
  .sheet h2{font-size:19px;margin-bottom:2px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}

  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .opt{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13.5px;text-align:left}
  .opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
  .opt small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .opt.on small{color:var(--brand)}
  .seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}

  .existing{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .exrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
  .exrow .x{margin-left:auto;color:var(--danger);font-weight:700;font-size:20px;width:30px;height:30px;display:grid;place-items:center}

  /* menu thao tác */
  .menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:4px}
  .mrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;background:var(--surface)}
  .mrow:last-child{border-bottom:0}
  .mrow:active{background:var(--surface-2)}
  .mrow.hi{background:var(--brand-soft)}
  .mic{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .mrow.hi .mic{background:#fff}
  .mtx{flex:1;min-width:0}
  .mtx b{display:block;font-size:14.5px;font-weight:700}
  .mtx small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  /* day selector */
  .daysel{display:flex;gap:6px;margin:2px 0 6px}
  .daysel button{flex:1;padding:8px 2px 6px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:13.5px;color:var(--muted);line-height:1.1}
  .daysel button small{display:block;font-size:10.5px;font-weight:600;margin-top:2px;opacity:.8}
  .daysel button.today{border-color:var(--brand);color:var(--brand)}
  .daysel button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .daysel button.on small{opacity:.95}
  /* thanh ngày + nút sửa */
  .dbar{display:flex;align-items:center;gap:10px;margin:12px 2px 2px}
  .dttl{font-weight:800;font-size:15px;flex:1}
  .editbtn{padding:7px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--brand);font-weight:700;font-size:13.5px}
  .editbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* roster blocks */
  .rblock{margin-top:10px;overflow:hidden}
  .rblock.lack{border-color:#EBC9C4}
  .rhead{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;padding:11px 14px 9px;border-bottom:1px solid var(--line)}
  .rhead .time{margin-left:auto;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
  .rrow{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
  .rrow:last-child{border-bottom:0}
  .rrow .rlabel{width:82px;flex:0 0 auto;font-weight:700;font-size:13.5px;padding-top:3px}
  .cnt{display:block;font-weight:700;font-size:11px;margin-top:2px;letter-spacing:.01em}
  .cnt.ok{color:#2E7D5B}
  .cnt.bad{color:var(--danger)}
  .rchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center;min-height:28px}
  /* xem: tên chữ, gọn */
  .names{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:2px}
  .nm2{font-weight:600;font-size:14.5px}
  .nm2 i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700;background:var(--surface-2);padding:1px 5px;border-radius:6px;margin-left:3px}
  .sep{color:var(--line);font-weight:700}
  .nobody{font-size:13px;color:var(--muted);font-style:italic}
  /* sửa: chip */
  .nchip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--ink)}
  .nchip:active{transform:scale(.96)}
  .nchip.bike{background:#FFF1D9;border-color:#F0D9A8}
  .nchip .tt{font-size:10.5px;color:var(--muted);font-weight:700;background:#fff;padding:1px 5px;border-radius:6px;margin-left:2px}
  .addp{width:28px;height:28px;border-radius:50%;border:1px dashed var(--line);color:var(--muted);font-weight:700;font-size:16px;background:transparent;line-height:1}
  .addp:active{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
  /* toggle */
  .tgl{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .18s;border:0}
  .tgl span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
  .tgl.on{background:var(--brand)}
  .tgl.on span{transform:translateX(20px)}
  .req-tbl{width:100%;border-collapse:collapse}
  .req-tbl th{font-size:12px;color:var(--muted);font-weight:700;padding:0 4px 8px;text-align:center}
  .req-tbl th:first-child{text-align:left}
  .req-tbl td{padding:4px}

<script>
/* ============================================================
   Xếp Ca — quản lý ca cà phê (chạy offline, lưu trong máy)
   ============================================================ */
const DOW = ['T2','T3','T4','T5','T6','T7','CN'];
const DOW_FULL = ['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const STORE_KEY = 'xepca_v1';

/* ---------- default data ---------- */
function defaultData(){
  return {
    settings:{
      branch:'Cơ sở 3',
      sheetUrl:'https://docs.google.com/spreadsheets/d/1W1rpyFg-EuqydUXWseM0lBhududLmSrJ_tgY8gAjeto/edit?gid=0',
      minShifts:4,                        // số ca tối thiểu mỗi người/tuần (0 = tắt)
      maxShifts:6,                        // số ca tối đa mỗi người/tuần (0 = không giới hạn)
      minToi:1,                           // số ca TỐI tối thiểu mỗi người/tuần (0 = tắt)
      noSameConsec:true,                  // không làm cùng 1 buổi ở 2 ngày liên tiếp
      maxPerDay:1,                        // tối đa số buổi 1 người/ngày
      coverFirst:false,                   // KHÔNG cho làm 2 ca/ngày (đủ người thì không cần)
      _cfg2:true, _cfg3:true,             // đánh dấu đã áp các cấu hình
      positions:['Pha chế','Phục vụ'],   // Giữ xe là 1 phục vụ được đánh dấu (flag bike)
      // định mức người mỗi CA (theo khung giờ) × vị trí — keyed theo shiftType.id
      req:{
        s1:{'Pha chế':2,'Phục vụ':3},
        s2:{'Pha chế':2,'Phục vụ':2},
        s3:{'Pha chế':1,'Phục vụ':3},
        s4:{'Pha chế':1,'Phục vụ':2}
      }
    },
    shiftTypes:[
      {id:'s1', label:'7h-12h30',  hours:5.5},
      {id:'s2', label:'12h30-17h30',hours:5},
      {id:'s3', label:'17h30-00h', hours:6.5},
      {id:'s4', label:'19h-00h',   hours:5}
    ],
    employees:[],            // {id,name,phone,rate,pos}
    schedule:{},             // weekKey -> empId -> dayIdx -> [ {typeId,pos} ]
    leaves:[],               // {id,empId,date,reason}
    early:[]                 // {id,empId,date,time,reason}
  };
}

let DB = load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(STORE_KEY));
    if(r&&r.settings){ return migrate(r); }
  }catch(e){}
  return defaultData();
}
function migrate(r){
  const d=defaultData();
  r.settings=r.settings||{};
  if(!r.settings.positions||!r.settings.positions.length) r.settings.positions=d.settings.positions;
  if(!r.settings.req) r.settings.req=d.settings.req;
  if(r.settings.sheetUrl==null) r.settings.sheetUrl='';
  // đổi link sheet cũ -> sheet mới nhất
  if(r.settings.sheetUrl.includes('1ZWwDEWoZyhM9c6yfVPTTnHj5649NDkrtp1yrVUy-fDA')
    || r.settings.sheetUrl.includes('14kMj5VarO4H-QuYbG1Sj95gCDQU3J8S5QskKl8XBZEg')) r.settings.sheetUrl=d.settings.sheetUrl;
  if(r.settings.minShifts==null) r.settings.minShifts=d.settings.minShifts;
  if(r.settings.maxShifts==null) r.settings.maxShifts=d.settings.maxShifts;
  if(r.settings.minToi==null) r.settings.minToi=d.settings.minToi;
  if(r.settings.noSameConsec==null) r.settings.noSameConsec=d.settings.noSameConsec;
  if(r.settings.maxPerDay==null) r.settings.maxPerDay=d.settings.maxPerDay;
  if(r.settings.coverFirst==null) r.settings.coverFirst=d.settings.coverFirst;
  delete r.settings.maxSameBuoi;   // thay bằng luật "không cùng buổi 2 ngày liên tiếp"
  // Giữ xe không còn là vị trí -> chuyển thành Phục vụ + flag giữ xe
  if(r.settings.positions.includes('Giữ xe')){
    r.settings.positions=r.settings.positions.filter(p=>p!=='Giữ xe');
    if(!r.settings.positions.includes('Phục vụ')) r.settings.positions.push('Phục vụ');
    Object.values(r.settings.req||{}).forEach(o=>{ if(o&&'Giữ xe' in o) delete o['Giữ xe']; });
    Object.values(r.schedule||{}).forEach(wk=>Object.values(wk).forEach(days=>Object.values(days).forEach(arr=>{
      arr.forEach(c=>{ if(c.pos==='Giữ xe'){ c.pos='Phục vụ'; c.bike=true; } });
    })));
  }
  r.shiftTypes=r.shiftTypes||d.shiftTypes;
  // đổi định mức theo buổi (m/a/e) -> theo từng CA (shiftType.id)
  if(r.settings.req && (r.settings.req.m||r.settings.req.a||r.settings.req.e)){
    const old=r.settings.req; const nu={};
    r.shiftTypes.forEach(st=>{
      const canon=canonicalShiftFor2(r.shiftTypes, coveredPeriods(st)[0]);
      nu[st.id] = (canon && canon.id===st.id) ? Object.assign({}, old[coveredPeriods(st)[0]]||{}) : {};
    });
    r.settings.req=nu;
  }
  // cấu hình đợt 2 (áp 1 lần): tắt xếp 2 ca/ngày + định mức 2 ca tối
  if(!r.settings._cfg2){
    r.settings.coverFirst=false;
    r.settings.req=r.settings.req||{};
    const setReq=(label,pc,pv)=>{ const st=(r.shiftTypes||[]).find(s=>s.label===label); if(st){ r.settings.req[st.id]=Object.assign({}, r.settings.req[st.id], {'Pha chế':pc,'Phục vụ':pv}); } };
    setReq('17h30-00h',1,3); setReq('19h-00h',1,2);
    r.settings._cfg2=true;
  }
  // cấu hình đợt 3 (áp 1 lần): trần 6 ca/tuần cho đủ pha chế
  if(!r.settings._cfg3){ r.settings.maxShifts=6; r.settings._cfg3=true; }
  r.employees=r.employees||[];
  r.schedule=r.schedule||{};
  r.leaves=r.leaves||[];
  r.early=r.early||[];
  r.availability=r.availability||{};   // weekKey -> empId -> {dayIdx:[periodKeys]}
  return r;
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- date helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYMD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function dmShort(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1);}
let curMonday = mondayOf(new Date());

/* ---------- shift time parsing (for period coverage) ---------- */
function parseTime(t){ // '7h', '12h30', '00h'
  t=t.trim(); const m=t.match(/(\d{1,2})h(\d{0,2})/); if(!m)return null;
  let h=+m[1], mm=m[2]?+m[2]:0; if(h===0)h=24; return h*60+mm;
}
function shiftRange(st){
  const p=st.label.split('-'); if(p.length!==2)return null;
  const a=parseTime(p[0]), b=parseTime(p[1]); if(a==null||b==null)return null;
  return [a,b];
}
// periods: morning 7:00-12:30, afternoon 12:30-17:30, evening 17:30-24:00
const PERIODS=[
  {key:'m', name:'Sáng', a:420, b:750, cls:'m'},
  {key:'a', name:'Chiều', a:750, b:1050, cls:'a'},
  {key:'e', name:'Tối', a:1050, b:1440, cls:'e'}
];
function coveredPeriods(st){
  const r=shiftRange(st); if(!r)return [];
  return PERIODS.filter(p=> r[0]<p.b && r[1]>p.a).map(p=>p.key);
}
function shiftClass(st){ // color class by span
  const cov=coveredPeriods(st);
  if(cov.length>=2) return 'full';
  if(cov.length===1) return cov[0];
  return 'off';
}
// khung giờ chuẩn cho một buổi (dùng khi nhập đăng ký): chọn ca phủ đúng buổi đó, dài nhất
function canonicalShiftFor2(list,pk){
  const cands=list.filter(t=>{const c=coveredPeriods(t);return c.length===1&&c[0]===pk;});
  if(!cands.length){ const any=list.filter(t=>coveredPeriods(t).includes(pk)); if(any.length) return any.slice().sort((a,b)=>b.hours-a.hours)[0]; return null; }
  return cands.slice().sort((a,b)=>b.hours-a.hours)[0];
}
function canonicalShiftFor(pk){ return canonicalShiftFor2(DB.shiftTypes,pk); }
// định mức của 1 ca
function reqFor(st){ return (DB.settings.req[st.id])||{}; }
// người có rảnh làm ca này không (rảnh mọi buổi ca đó phủ)
function isFreeForShift(avail,id,d,st){ return coveredPeriods(st).every(pk=> avail[id]&&avail[id][d]&&avail[id][d].includes(pk)); }
// {role:count} đã xếp cho 1 ca cụ thể trong 1 ngày
function shiftAssigned(mon,day,stId){
  const m={};
  DB.employees.forEach(e=>cellShifts(mon,e.id,day).forEach(c=>{ if(c.typeId===stId){ const r=c.pos||'(?)'; m[r]=(m[r]||0)+1; } }));
  return m;
}
function typeById(id){return DB.shiftTypes.find(s=>s.id===id);}
function empById(id){return DB.employees.find(e=>e.id===id);}
function initials(name){const p=name.trim().split(/\s+/);return (p.length>1?p[p.length-2][0]+p[p.length-1][0]:name.slice(0,2)).toUpperCase();}

/* ---------- schedule access ---------- */
function weekKey(monday){return ymd(monday);}
function cellShifts(monday,empId,day){
  const wk=DB.schedule[weekKey(monday)]; if(!wk)return[];
  const e=wk[empId]; if(!e)return[];
  return e[day]||[];
}
function setCell(monday,empId,day,arr){
  const k=weekKey(monday);
  DB.schedule[k]=DB.schedule[k]||{};
  DB.schedule[k][empId]=DB.schedule[k][empId]||{};
  if(arr&&arr.length) DB.schedule[k][empId][day]=arr;
  else { delete DB.schedule[k][empId][day]; }
  save();
}
function weekHours(monday,empId){
  let h=0;
  for(let d=0;d<7;d++) cellShifts(monday,empId,d).forEach(c=>{const t=typeById(c.typeId);if(t)h+=t.hours;});
  return h;
}
function onLeave(dateStr,empId){ return DB.leaves.some(l=>l.empId===empId && dateStr>=l.date && dateStr<=(l.dateEnd||l.date)); }

/* ============================================================
   NAVIGATION
   ============================================================ */
const views={today:'v-today',week:'v-week',staff:'v-staff',leave:'v-leave',settings:'v-settings'};
let curTab='week';
function go(tab){
  curTab=tab;
  Object.values(views).forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(views[tab]).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  window.scrollTo(0,0);
  render();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.getElementById('btnSettings').onclick=()=>go('settings');

document.getElementById('fabBtn').onclick=()=>{
  if(curTab==='staff') openEmpSheet();
  else if(curTab==='leave') openLeaveSheet();
};

/* ============================================================
   RENDER dispatch
   ============================================================ */
function render(){
  document.getElementById('brandName').textContent='Tiệm Cà Phê Cá Hồi';
  document.getElementById('brandSub').textContent=(DB.settings.branch||'')+' · Xếp ca';
  const fab=document.getElementById('fab');
  fab.style.display=(curTab==='staff'||curTab==='leave')?'block':'none';
  if(curTab==='today') renderToday();
  if(curTab==='week') renderWeek();
  if(curTab==='staff') renderStaff();
  if(curTab==='leave') renderLeave();
  if(curTab==='settings') renderSettings();
}

/* ============================================================
   TODAY
   ============================================================ */
function renderToday(){
  const el=document.getElementById('v-today');
  const now=new Date(); const today=ymd(now);
  const mon=mondayOf(now); const dayIdx=(now.getDay()+6)%7;
  // gather workers today
  const working=[];
  DB.employees.forEach(e=>{
    cellShifts(mon,e.id,dayIdx).forEach(c=>{const t=typeById(c.typeId);if(t)working.push({e,c,t});});
  });
  const earlyToday=DB.early.filter(x=>x.date===today);
  const leaveToday=DB.leaves.filter(l=>today>=l.date && today<=(l.dateEnd||l.date));

  // ca đang diễn ra theo giờ thực (dựa khung giờ của từng ca)
  const nowMin=now.getHours()*60+now.getMinutes();
  const inRange=st=>{const r=shiftRange(st); return r && nowMin>=r[0] && nowMin<r[1];};
  const activeShifts=DB.shiftTypes.filter(inRange);
  const nextSt=activeShifts.length?null:DB.shiftTypes.filter(st=>{const r=shiftRange(st);return r&&r[0]>nowMin;}).sort((a,b)=>shiftRange(a)[0]-shiftRange(b)[0])[0];
  const curP=activeShifts.length?PERIODS.find(p=>coveredPeriods(activeShifts[0]).includes(p.key)):null;
  const statusTxt=activeShifts.length?`Đang trong ca ${activeShifts.map(s=>s.label).join(' + ')}`:(nextSt?`Ngoài giờ · sắp tới ca ${nextSt.label}`:'Ngoài giờ mở cửa');
  let html=`<div class="today-hero">
    <div class="dow">${DOW_FULL[dayIdx]} · ${pad(now.getDate())}/${pad(now.getMonth()+1)}</div>
    <div class="nowline">${curP?`<span class="livedot"></span>`:''}${statusTxt}</div>
    <div class="stats">
      <div><b class="tnum">${working.length}</b><span>lượt ca hôm nay</span></div>
      <div><b class="tnum">${earlyToday.length}</b><span>xin về sớm</span></div>
      <div><b class="tnum">${leaveToday.length}</b><span>nghỉ hôm nay</span></div>
    </div></div>`;

  if(DB.employees.length===0){
    html+=`<div class="empty" style="margin-top:20px"><div class="big">👋</div>Chưa có nhân viên nào.<br>Vào tab <b>Nhân viên</b> để thêm người của Cơ sở 3.</div>`;
    el.innerHTML=html; return;
  }

  const warns=dayWarnings(mon,dayIdx,today);
  if(warns.length) html+=`<div class="warnbox"><h3>⚠️ Cần chú ý hôm nay</h3><ul>${warns.map(w=>`<li>${w}</li>`).join('')}</ul></div>`;

  // từng CA — ca đang diễn ra nổi bật, còn lại mờ đi
  DB.shiftTypes.forEach(st=>{
    const active=activeShifts.some(s=>s.id===st.id);
    const cls=shiftClass(st);
    const byRole={}; DB.settings.positions.forEach(r=>byRole[r]=[]);
    working.forEach(w=>{ if(w.c.typeId===st.id) (byRole[w.c.pos]=byRole[w.c.pos]||[]).push(w); });
    const req=reqFor(st);
    html+=`<div class="tblock card ${active?'live':'dim'}">
      <div class="rhead"><span class="dot c-${cls}"></span>${st.label}
        ${active?'<span class="livetag">ĐANG DIỄN RA</span>':''}
        <span class="time">${fmtH(st.hours)}</span></div>`;
    DB.settings.positions.forEach(role=>{
      const list=byRole[role]||[]; const need=req[role]||0;
      const ok=!need||list.length>=need;
      html+=`<div class="rrow"><div class="rlabel">${role}${need?`<span class="cnt ${ok?'ok':'bad'}">${ok?'✓ ':''}${list.length}/${need}</span>`:''}</div><div class="rchips">`;
      if(list.length){
        html+=`<div class="names">`+list.map(w=>{
          const early=earlyToday.find(x=>x.empId===w.e.id);
          return `<span class="nm2">${w.c.bike?'🛵 ':''}${esc(w.e.name)}${early?`<i class="early">về ${early.time}</i>`:''}</span>`;
        }).join('<span class="sep">·</span>')+`</div>`;
      } else html+=`<span class="nobody">chưa có ai</span>`;
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });

  if(leaveToday.length){
    html+=`<div class="sec-title">Nghỉ hôm nay</div><div class="card pad" style="font-size:14px">`+
      leaveToday.map(l=>{const e=empById(l.empId);return `🌙 <b>${e?esc(e.name):'?'}</b>${l.reason?` <span class="muted">— ${esc(l.reason)}</span>`:''}`;}).join('<br>')+`</div>`;
  }
  if(working.length===0){
    html+=`<div class="empty" style="margin-top:16px"><div class="big">🌤️</div>Chưa xếp ca cho hôm nay.<br>Vào <b>Lịch tuần</b> để xếp ca.</div>`;
  }
  el.innerHTML=html;
}
// đếm số người theo vị trí trong 1 CA của 1 ngày -> {role:count}
function staffCount(mon,dayIdx,stId){
  const m={};
  DB.employees.forEach(e=>cellShifts(mon,e.id,dayIdx).forEach(c=>{ if(c.typeId===stId){ const r=c.pos||'(?)'; m[r]=(m[r]||0)+1; } }));
  return m;
}
function dayWarnings(mon,dayIdx,dateStr){
  const w=[];
  DB.shiftTypes.forEach(st=>{
    const req=reqFor(st);
    const have=staffCount(mon,dayIdx,st.id);
    const total=Object.values(have).reduce((a,b)=>a+b,0);
    if(!total) return;   // chỉ báo khi ca đã có người mà thiếu vị trí nào đó
    Object.keys(req).forEach(role=>{
      const need=req[role], got=have[role]||0;
      if(got<need) w.push(`Ca <b>${st.label}</b> thiếu <b>${role}</b>: ${got}/${need}.`);
    });
  });
  DB.employees.forEach(e=>{
    if(onLeave(dateStr,e.id) && cellShifts(mon,e.id,dayIdx).length)
      w.push(`<b>${e.name}</b> đã xin nghỉ nhưng vẫn được xếp ca.`);
    // sáng + tối cùng ngày = quá mệt
    const pks=[]; cellShifts(mon,e.id,dayIdx).forEach(c=>{const t=typeById(c.typeId); if(t)coveredPeriods(t).forEach(k=>{if(!pks.includes(k))pks.push(k);});});
    if(pks.includes('m')&&pks.includes('e')) w.push(`<b>${e.name}</b> làm cả ca Sáng lẫn ca Tối trong ngày — quá mệt, nên đổi.`);
  });
  return w;
}

/* ============================================================
   WEEK GRID  (tính năng chính)
   ============================================================ */
let selDay=null, editMode=false, weekView='day';   // 'day' | 'emp'
function renderWeek(){
  const el=document.getElementById('v-week');
  const mon=curMonday; const sun=addDays(mon,6);
  const now=new Date(); const todayStr=ymd(now);
  // chọn ngày mặc định: hôm nay nếu trong tuần, không thì T2
  if(selDay==null){ const wd=(now.getDay()+6)%7; selDay=(ymd(mon)<=todayStr&&todayStr<=ymd(sun))?wd:0; }

  let html=`<div class="week-toolbar">
    <div class="weeknav">
      <button id="wPrev" aria-label="Tuần trước"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="wlabel"><b>${dmShort(mon)} – ${dmShort(sun)}</b><span>${weekLabel(mon)}</span></div>
      <button id="wNext" aria-label="Tuần sau"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button class="icon-btn" id="wToday" title="Về tuần này"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg></button>
    <button class="icon-btn" id="wMore" title="Thao tác"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>`;

  // chuyển chế độ xem
  html+=`<div class="seg" style="margin:8px 0 4px"><button id="vwDay" class="${weekView==='day'?'on':''}">Theo ngày</button><button id="vwEmp" class="${weekView==='emp'?'on':''}">Theo người</button></div>`;

  if(weekView==='emp'){
    html+=renderEmpWeek(mon);
    el.innerHTML=html;
    bindWeekNav(); bindViewSeg();
    document.querySelectorAll('.erow').forEach(r=>r.onclick=()=>{ const d=+r.dataset.jump; if(!isNaN(d)){ selDay=d; weekView='day'; renderWeek(); } });
    return;
  }

  // thanh chọn ngày
  html+=`<div class="daysel">`;
  for(let d=0;d<7;d++){
    const date=addDays(mon,d); const isT=ymd(date)===todayStr;
    html+=`<button class="${d===selDay?'on':''} ${isT?'today':''}" data-day="${d}">${DOW[d]}<small>${dmShort(date)}</small></button>`;
  }
  html+=`</div>`;

  if(DB.employees.length===0){
    html+=`<div class="empty" style="padding-bottom:8px"><div class="big">📋</div>Chưa có nhân viên.<br>Đồng bộ đăng ký từ Google Sheet để app tự tạo,<br>hoặc thêm tay ở tab <b>Nhân viên</b>.</div>
      <button class="btn wide" id="btnSyncEmpty" style="margin-top:4px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>Đồng bộ từ Google Sheet</button>`;
    el.innerHTML=html;
    bindWeekNav(); bindDaySel(); bindViewSeg();
    const se=document.getElementById('btnSyncEmpty'); if(se) se.onclick=syncFromSheet;
    return;
  }

  const dDate=addDays(mon,selDay); const dStr=ymd(dDate);
  // thanh: ngày + nút Sửa
  html+=`<div class="dbar"><div class="dttl">${DOW_FULL[(dDate.getDay()+6)%7]}, ${dmShort(dDate)}</div>
    <button class="editbtn ${editMode?'on':''}" id="btnEdit">${editMode?'✓ Xong':'✎ Sửa'}</button></div>`;

  const dw=dayWarnings(mon,selDay,dStr);
  if(dw.length) html+=`<div class="warnbox"><h3>⚠️ Ngày ${DOW[selDay]} cần chú ý</h3><ul>${dw.map(w=>`<li>${w}</li>`).join('')}</ul></div>`;

function bindDaySel(){
  document.querySelectorAll('.daysel button').forEach(b=>b.onclick=()=>{selDay=+b.dataset.day;renderWeek();});
}
function bindViewSeg(){
  const a=document.getElementById('vwDay'), b=document.getElementById('vwEmp');
  if(a) a.onclick=()=>{weekView='day';renderWeek();};
  if(b) b.onclick=()=>{weekView='emp';renderWeek();};
}
/* --- xem theo người: mỗi bạn 1 dòng × 7 ngày --- */
function renderEmpWeek(mon){
  if(!DB.employees.length) return `<div class="empty"><div class="big">📋</div>Chưa có nhân viên.</div>`;
  const todayStr=ymd(new Date());
  let hl=-1; for(let d=0;d<7;d++) if(ymd(addDays(mon,d))===todayStr) hl=d;
  let h=`<div class="card" style="margin-top:10px;overflow:hidden">`;
  DB.employees.forEach(e=>{
    let n=0; for(let d=0;d<7;d++) n+=cellShifts(mon,e.id,d).length;
    const hrs=weekHours(mon,e.id);
    const low=DB.settings.minShifts&&n<DB.settings.minShifts;
    h+=`<div class="erow"><div class="ename">${esc(e.name)}<small>${esc(e.pos||'')} · <span class="${low?'danger-text':''}">${n} ca</span> · ${fmtH(hrs)}</small></div>${empWeekStrip(mon,e.id,hl)}</div>`;
  });
  h+=`</div><div class="legend" style="margin-top:10px">
    <span><span class="pl pm">S</span>Sáng</span><span><span class="pl pa">C</span>Chiều</span><span><span class="pl pe">T</span>Tối</span>
    <span class="muted">Bấm 1 dòng để về ngày hôm nay</span></div>`;
  return h;
}
/* --- các buổi của 1 người trong 1 ngày --- */
function periodsOf(mon,empId,day){
  const s=[]; cellShifts(mon,empId,day).forEach(c=>{const t=typeById(c.typeId); if(t)coveredPeriods(t).forEach(k=>{if(!s.includes(k))s.push(k);});});
  return s;
}
const PL={m:'S',a:'C',e:'T'};
/* --- dải 7 ngày của 1 người (xem nhanh cả tuần) --- */
function empWeekStrip(mon,empId,hlDay){
  let h='<div class="wstrip">';
  for(let d=0;d<7;d++){
    const pks=periodsOf(mon,empId,d);
    const txt=pks.length?pks.map(k=>`<span class="pl p${k}">${PL[k]}</span>`).join(''):'<span class="dash">–</span>';
    h+=`<div class="wcell ${pks.length?'has':'none'} ${d===hlDay?'hl':''}"><span class="wd">${DOW[d]}</span><span class="wv">${txt}</span></div>`;
  }
  return h+'</div>';
}
function renderShiftBlock(mon,day,st){
  const cls=shiftClass(st);
  // gom theo vị trí — CHỈ người xếp đúng ca này
  const byRole={}; DB.settings.positions.forEach(r=>byRole[r]=[]);
  DB.employees.forEach(e=>{
    cellShifts(mon,e.id,day).forEach((c,ci)=>{
      if(c.typeId===st.id){ (byRole[c.pos]=byRole[c.pos]||[]).push({e,c,ci}); }
    });
  });
  const req=reqFor(st);
  const totalHave=Object.values(byRole).reduce((a,l)=>a+l.length,0);
  const totalNeed=Object.values(req).reduce((a,b)=>a+b,0);
  const allOk=!totalNeed||totalHave>=totalNeed;
  let h=`<div class="rblock card ${allOk?'':'lack'}"><div class="rhead"><span class="dot c-${cls}"></span>${st.label}<span class="time">${fmtH(st.hours)}</span></div>`;
  DB.settings.positions.forEach(role=>{
    const list=byRole[role]||[];
    const need=req[role]||0;
    const ok=!need||list.length>=need;
    const badge=need?`<span class="cnt ${ok?'ok':'bad'}">${ok?'✓ ':''}${list.length}/${need}</span>`:'';
    h+=`<div class="rrow"><div class="rlabel">${role}${badge}</div><div class="rchips">`;
    if(editMode){
      list.forEach(x=>{
        h+=`<button class="nchip ${x.c.bike?'bike':''}" data-act="chip" data-day="${day}" data-emp="${x.e.id}" data-ci="${x.ci}">${x.c.bike?'🛵 ':''}${esc(x.e.name)}</button>`;
      });
      h+=`<button class="addp" data-act="add" data-day="${day}" data-st="${st.id}" data-role="${esc(role)}" aria-label="Thêm">+</button>`;
    }else{
      if(list.length){
        h+=`<div class="names">`+list.map(x=>`<span class="nm2">${x.c.bike?'🛵 ':''}${esc(x.e.name)}</span>`).join('<span class="sep">·</span>')+`</div>`;
      } else h+=`<span class="nobody">chưa có ai</span>`;
    }
    h+=`</div></div>`;
  });
  h+=`</div>`;
  return h;
}
function bindRoster(){
  document.querySelectorAll('#v-week [data-act]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.act;
      if(a==='chip') openAssignSheet(+b.dataset.day,b.dataset.emp,+b.dataset.ci);
      else if(a==='add') openAddSheet(+b.dataset.day,b.dataset.st,b.dataset.role);
    };
  });
}
/* --- thêm người vào 1 CA (khung giờ) + vị trí --- */
function openAddSheet(day,stId,role){
  const mon=curMonday; const st=typeById(stId); if(!st)return; const wk=weekKey(mon);
  const pk=coveredPeriods(st)[0]; const p=PERIODS.find(x=>x.key===pk)||{name:st.label};
  const av=(DB.availability&&DB.availability[wk])||{};
  const isFree=id=> isFreeForShift(av,id,day,st);
  // ai chưa có ca phủ buổi(s) mà ca này chiếm (tránh trùng giờ)
  let list=DB.employees.filter(e=>!cellShifts(mon,e.id,day).some(c=>{const t=typeById(c.typeId);return t&&coveredPeriods(t).some(k=>coveredPeriods(st).includes(k));}));
  // xếp: đúng vị trí + đã đăng ký rảnh lên đầu
  list.sort((a,b)=>{
    const af=(isFree(a.id)?0:1)+(a.pos===role?0:2), bf=(isFree(b.id)?0:1)+(b.pos===role?0:2);
    return af-bf;
  });
  let html=`<div class="grip"></div><h2>Thêm ${esc(role)}</h2><div class="sub">${DOW_FULL[(addDays(mon,day).getDay()+6)%7]}, ${dmShort(addDays(mon,day))} · ca ${st.label}</div>`;
  if(!list.length) html+=`<div class="empty" style="padding:18px">Mọi nhân viên đều đã có ca trùng giờ này.</div>`;
  else{ html+=`<div class="existing">`+list.map(e=>{
      const leave=onLeave(ymd(addDays(mon,day)),e.id); const free=isFree(e.id);
      // bối cảnh: hôm qua làm gì + tuần này mấy ca + có kẹt sáng/tối hôm nay không
      const yest= day>0? periodsOf(mon,e.id,day-1) : [];
      const yTxt= day>0 ? (yest.length? 'hôm qua: '+yest.map(k=>({m:'Sáng',a:'Chiều',e:'Tối'}[k])).join('+') : 'hôm qua: nghỉ') : '';
      let wk=0; for(let d2=0;d2<7;d2++) wk+=cellShifts(mon,e.id,d2).length;
      const today=periodsOf(mon,e.id,day);
      const clash=(pk==='m'&&today.includes('e'))||(pk==='e'&&today.includes('m'));
      const lateY= pk==='m' && yest.includes('e');
      const bits=[]; if(yTxt)bits.push(yTxt); bits.push('tuần: '+wk+' ca');
      const sub=leave?'<span class="danger-text">🌙 đã xin nghỉ</span>':bits.join(' · ');
      const flag= clash?'<span class="pill bg-full">⚠️ kẹt Sáng+Tối</span>' : (lateY?'<span class="pill bg-e">⚠️ tối hôm qua</span>':(free?'<span class="pill bg-a">✓ rảnh</span>':''));
      return `<button class="exrow" data-pick="${e.id}" style="width:100%;text-align:left"><div class="av" style="width:32px;height:32px;font-size:12px;border-radius:50%;background:${free?'#D8F0EC':'var(--brand-soft)'};color:var(--brand-ink);display:grid;place-items:center;font-weight:800">${initials(e.name)}</div><div style="flex:1;min-width:0"><b>${esc(e.name)}</b><div class="muted" style="font-size:11.5px">${sub}</div>${empWeekStrip(mon,e.id,day)}</div>${flag}</button>`;
    }).join('')+`</div>`; }
  document.getElementById('sheet').innerHTML=html;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const e=empById(b.dataset.pick); const arr=cellShifts(mon,e.id,day).slice();
    arr.push({typeId:st.id,pos:role});
    setCell(mon,e.id,day,arr);
    closeSheet(); toast('Đã thêm '+e.name); renderWeek();
  });
  openSheet();
}
/* --- sửa 1 ca của 1 người --- */
function openAssignSheet(day,empId,ci){
  const mon=curMonday; const e=empById(empId);
  const arr=cellShifts(mon,e.id,day).slice(); const c=arr[ci]; if(!c)return;
  const cur=typeById(c.typeId);
  const covers=DB.shiftTypes.filter(t=>{const cp=coveredPeriods(t); return cur?cp.some(k=>coveredPeriods(cur).includes(k)):true;});
  let html=`<div class="grip"></div><h2>${esc(e.name)}</h2><div class="sub">${DOW_FULL[(addDays(mon,day).getDay()+6)%7]}, ${dmShort(addDays(mon,day))} · ${cur?cur.label:''} · ${esc(c.pos||'')}</div>`;
  html+=`<div class="field"><label>Cả tuần của ${esc(e.name)}</label>${empWeekStrip(mon,e.id,day)}</div>`;
  html+=`<div class="field"><label>Khung giờ</label><div class="opt-grid">`+
    covers.map(t=>`<button class="opt ${t.id===c.typeId?'on':''}" data-t="${t.id}"><span class="dot c-${shiftClass(t)}"></span><span>${t.label}<small>${fmtH(t.hours)}</small></span></button>`).join('')+`</div></div>`;
  html+=`<div class="field"><label>Vị trí</label><div class="seg" id="posSeg">`+
    DB.settings.positions.map(pp=>`<button data-p="${esc(pp)}" class="${c.pos===pp?'on':''}">${esc(pp)}</button>`).join('')+`</div></div>`;
  const pkOf=(cur&&coveredPeriods(cur)[0])||null;
  if(c.pos==='Phục vụ'&&pkOf) html+=`<button class="btn ghost wide" id="bikeBtn" style="margin-top:6px;${c.bike?'background:#FFF1D9;border-color:#F0D9A8;color:#8a5410':''}">${c.bike?'🛵 Đang giữ xe — bấm để bỏ':'🛵 Đặt làm người giữ xe'}</button>`;
  html+=`<button class="btn ghost wide danger-text" id="rmShift" style="margin-top:6px">Xoá ca này</button>
    <button class="btn wide" id="doneShift" style="margin-top:10px">Xong</button>`;
  document.getElementById('sheet').innerHTML=html;
  const bb=document.getElementById('bikeBtn');
  if(bb) bb.onclick=()=>{ setBikeFor(day,pkOf, c.bike?null:e.id); closeSheet(); renderWeek(); };
  let draft={typeId:c.typeId,pos:c.pos,bike:c.bike};
  document.querySelectorAll('.opt-grid .opt').forEach(b=>b.onclick=()=>{draft.typeId=b.dataset.t;document.querySelectorAll('.opt-grid .opt').forEach(z=>z.classList.toggle('on',z===b));});
  document.querySelectorAll('#posSeg button').forEach(b=>b.onclick=()=>{draft.pos=b.dataset.p;document.querySelectorAll('#posSeg button').forEach(z=>z.classList.toggle('on',z===b));});
  document.getElementById('rmShift').onclick=()=>{ arr.splice(ci,1); setCell(mon,e.id,day,arr); closeSheet(); toast('Đã xoá'); renderWeek(); };
  document.getElementById('doneShift').onclick=()=>{
    if(draft.pos!=='Phục vụ') draft.bike=false;
    arr[ci]={typeId:draft.typeId,pos:draft.pos,...(draft.bike?{bike:true}:{})};
    setCell(mon,e.id,day,arr); closeSheet(); renderWeek();
  };
  openSheet();
}
/* --- đặt người giữ xe cho 1 buổi (chỉ 1 người) --- */
function setBikeFor(day,pk,empId){
  const mon=curMonday;
  DB.employees.forEach(e=>{
    const arr=cellShifts(mon,e.id,day); let changed=false;
    arr.forEach(c=>{ const st=typeById(c.typeId);
      if(c.pos==='Phục vụ'&&st&&coveredPeriods(st).includes(pk)){
        const want=(e.id===empId); if(!!c.bike!==want){ c.bike=want; changed=true; }
      }
    });
    if(changed) setCell(mon,e.id,day,arr.slice());
  });
  save(); toast(empId?'Đã chọn người giữ xe':'Đã bỏ giữ xe');
}
function fmtH(h){ return (Number.isInteger(h)?h:h.toFixed(1))+'h'; }
function weekLabel(mon){
  const now=mondayOf(new Date());
  const diff=Math.round((mon-now)/(7*864e5));
  if(diff===0)return 'Tuần này'; if(diff===-1)return 'Tuần trước'; if(diff===1)return 'Tuần sau';
  return diff>0?`+${diff} tuần`:`${diff} tuần`;
}
function bindWeekNav(){
  document.getElementById('wPrev').onclick=()=>{curMonday=addDays(curMonday,-7);renderWeek();};
  document.getElementById('wNext').onclick=()=>{curMonday=addDays(curMonday,7);renderWeek();};
  document.getElementById('wToday').onclick=()=>{curMonday=mondayOf(new Date());selDay=null;renderWeek();};
  const m=document.getElementById('wMore'); if(m) m.onclick=openActionsSheet;
}
function bindGridCells(){
  document.querySelectorAll('#v-week td.cell').forEach(td=>{
    td.onclick=()=>{
      const empId=td.dataset.emp, day=+td.dataset.day;
      if(swapMode){ handleSwap(empId,day); return; }
      openCellSheet(empId,day);
    };
  });
}
function handleSwap(empId,day){
  if(!swapSel){ swapSel={empId,day}; renderWeek(); return; }
  if(swapSel.empId===empId&&swapSel.day===day){ swapSel=null; renderWeek(); return; }
  const a=cellShifts(curMonday,swapSel.empId,swapSel.day).slice();
  const b=cellShifts(curMonday,empId,day).slice();
  setCell(curMonday,swapSel.empId,swapSel.day,b);
  setCell(curMonday,empId,day,a);
  swapSel=null;
  toast('Đã đổi ca');
  renderWeek();
}
function copyPrevWeek(){
  const prev=addDays(curMonday,-7);
  const src=DB.schedule[weekKey(prev)];
  if(!src){ toast('Tuần trước chưa có lịch'); return; }
  DB.schedule[weekKey(curMonday)]=JSON.parse(JSON.stringify(src));
  save(); toast('Đã chép lịch tuần trước'); renderWeek();
}
function weekWarnings(mon){
  const w=[];
  for(let d=0;d<7;d++){
    const ds=ymd(addDays(mon,d));
    DB.shiftTypes.forEach(st=>{
      const req=reqFor(st);
      const have=staffCount(mon,d,st.id);
      const total=Object.values(have).reduce((a,b)=>a+b,0);
      if(!total) return;
      Object.keys(req).forEach(role=>{
        const need=req[role], got=have[role]||0;
        if(got<need) w.push(`<b>${DOW[d]}</b> ca ${st.label} thiếu ${role}: ${got}/${need}.`);
      });
    });
    DB.employees.forEach(e=>{ if(onLeave(ds,e.id)&&cellShifts(mon,e.id,d).length) w.push(`<b>${DOW[d]}</b>: ${e.name} xin nghỉ nhưng vẫn có ca.`); });
  }
  return w.slice(0,10);
}

/* ---------- cell editor sheet ---------- */
let sheetState=null;
function openCellSheet(empId,day){
  const e=empById(empId); const date=addDays(curMonday,day);
  sheetState={empId,day,draft:cellShifts(curMonday,empId,day).map(c=>({...c}))};
  const leave=onLeave(ymd(date),empId);
  drawCellSheet(e,date,leave);
  openSheet();
}
function drawCellSheet(e,date,leave){
  const s=sheetState;
  const defPos=e.pos||'';
  let html=`<div class="grip"></div>
    <h2>${e.name}</h2>
    <div class="sub">${DOW_FULL[(date.getDay()+6)%7]}, ${dmShort(date)}</div>`;
  if(leave) html+=`<div class="swapbar" style="background:var(--danger-soft);border-color:#F0C4C0;color:var(--danger)">🌙 Nhân viên này đã xin nghỉ hôm nay.</div>`;

  if(s.draft.length){
    html+=`<div class="existing">`;
    s.draft.forEach((c,i)=>{
      const t=typeById(c.typeId);

/* ============================================================
   NHẬP ĐĂNG KÝ CA (từ Google Sheet xuất CSV)
   ============================================================ */
function noAccent(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();}
function parseCSV(text){
  text=text.replace(/^﻿/,''); const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch==='\r'){} else cur+=ch; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
const DOW_TOKEN={t2:0,t3:1,t4:2,t5:3,t6:4,t7:5,cn:6};
function colMeta(header){
  const h=noAccent(header);
  let day=null; const dm=h.match(/\b(t[2-7]|cn)\b/); if(dm) day=DOW_TOKEN[dm[1]];
  let pk=null; if(/sang/.test(h))pk='m'; else if(/chieu/.test(h))pk='a'; else if(/toi/.test(h))pk='e';
  return (day!=null&&pk)?{day,pk}:null;
}
function isClaimed(v){ const n=noAccent(v); return n!=='' && !['0','off','nghi','x0','-'].includes(n); }
function matchRole(v){
  const n=noAccent(v);
  const found=DB.settings.positions.find(p=>noAccent(p)===n);
  if(found)return found;
  if(/pha\s*che/.test(n))return 'Pha chế';
  if(/giu\s*xe|phuc\s*vu/.test(n))return 'Phục vụ';   // giữ xe gộp vào phục vụ
  return v.trim()||'Phục vụ';
}
function onImportFile(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ processRegistration(rd.result); }catch(e){ alert('Không đọc được file này. Hãy chắc bạn đã tải Google Sheet ở dạng CSV.\n\n('+e.message+')'); } };
  rd.readAsText(f,'utf-8');
  ev.target.value='';
}
// build link CSV (gviz) từ link Google Sheet bình thường
function sheetCsvUrl(link){
  const m=String(link).match(/\/spreadsheets\/d\/([a-zA-Z0-9\-_]+)/); if(!m)return null;
  let gid='0'; const g=String(link).match(/[#&?]gid=(\d+)/); if(g)gid=g[1];
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${gid}`;
}
async function syncFromSheet(){
  const link=(DB.settings.sheetUrl||'').trim();
  if(!link){ toast('Chưa có link Sheet — vào Cài đặt để dán'); go('settings'); return; }
  const url=sheetCsvUrl(link);
  if(!url){ toast('Link Google Sheet không hợp lệ'); return; }
  toast('Đang tải từ Google Sheet…');
  let text;
  try{
    const r=await fetch(url+'&_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    text=await r.text();
  }catch(e){
    alert('Không tải được từ Google Sheet.\n\nKiểm tra: có mạng chưa, và Sheet đã đặt chia sẻ "Bất kỳ ai có đường liên kết".\n\n('+e.message+')');
    renderWeek(); return;
  }
  try{ processRegistration(text); }
  catch(e){ alert('Lấy được dữ liệu nhưng chưa đọc được: '+e.message); renderWeek(); }
}

function processRegistration(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c&&c.trim()!==''));
  // tìm dòng tiêu đề = dòng có nhiều cột buổi nhất (VD "T2 Sáng"). Bền vững kể cả khi
  // Google gộp tiêu đề/hướng dẫn vào ô "Tên".
  let hi=-1, best=0;
  for(let i=0;i<rows.length;i++){ const cnt=rows[i].filter(c=>colMeta(c)).length; if(cnt>best){best=cnt;hi=i;} }
  if(hi<0||best<3) throw new Error('Không đọc được bảng đăng ký (thiếu các cột buổi như "T2 Sáng").');
  const header=rows[hi];
  const metas=header.map(colMeta);
  const nameRe=/(^|[^a-z])ten([^a-z]|$)/;
  let roleCol=header.findIndex(c=>/vi\s*tri/.test(noAccent(c)));
  let nameCol=header.findIndex((c,i)=>!metas[i] && i!==roleCol && nameRe.test(noAccent(c)));
  if(nameCol<0) nameCol=header.findIndex((c,i)=>!metas[i] && i!==roleCol && !/tong|total/.test(noAccent(c)));
  if(nameCol<0) nameCol=0;
  if(roleCol<0) roleCol=nameCol+1;
  const isName=x=>nameRe.test(noAccent(x||''));
  // gom đăng ký theo thứ tự dòng
  const people=[];
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]; const name=(row[nameCol]||'').trim(); if(!name||isName(name)) continue;
    const role=matchRole(row[roleCol]||'');
    const claims=[];
    metas.forEach((m,i)=>{ if(m && isClaimed(row[i]||'')) claims.push(m); });
    if(claims.length) people.push({name,role,claims});
  }
  if(!people.length) throw new Error('Chưa có ai đăng ký ca trong file');
  showImportPreview(people);
}
function showImportPreview(people){

/* ---------- thuật toán xếp ca cân bằng từ buổi rảnh ---------- */
function runAutoSchedule(mon){
  const wk=weekKey(mon); const avail=DB.availability[wk]||{};
  const load={}; const cnt={};   // cnt[emp][pk] = số ca cùng buổi trong tuần
  DB.employees.forEach(e=>{ load[e.id]=0; cnt[e.id]={m:0,a:0,e:0}; });
  const minS=DB.settings.minShifts||0;
  const maxS=DB.settings.maxShifts||99;
  const minToi=DB.settings.minToi||0;
  const noConsec=!!DB.settings.noSameConsec;
  const maxDay=DB.settings.maxPerDay||2;
  const newWeek={}; const gaps=[];
  const isFree=(id,d,pk)=> avail[id] && avail[id][d] && avail[id][d].includes(pk);
  const busyPeriod=(id,d,pk)=> (newWeek[id]&&newWeek[id][d]||[]).some(c=>coveredPeriods(typeById(c.typeId)).includes(pk));
  // các buổi đã xếp cho người này trong ngày d
  const periodsToday=(id,d)=>{ const s=[]; (newWeek[id]&&newWeek[id][d]||[]).forEach(c=>coveredPeriods(typeById(c.typeId)).forEach(k=>{if(!s.includes(k))s.push(k);})); return s; };
  // hôm qua có làm đúng buổi này không (để không lặp cùng buổi 2 ngày liên tiếp)
  const sameBuoiYesterday=(id,d,pk)=> d>0 && (newWeek[id]&&newWeek[id][d-1]||[]).some(c=>coveredPeriods(typeById(c.typeId)).includes(pk));
  // số người đã xếp cho 1 CA (ngày, khung giờ, vị trí)
  const haveShift=(d,stId,role)=>{ let n=0; DB.employees.forEach(e=>{(newWeek[e.id]&&newWeek[e.id][d]||[]).forEach(c=>{ if(c.typeId===stId && c.pos===role) n++; }); }); return n; };
  // đã có ca chiếm buổi mà ca `st` cần (tránh trùng giờ, VD 17h30 vs 19h)
  const busyOverlap=(id,d,st)=> periodsToday(id,d).some(k=>coveredPeriods(st).includes(k));
  const doubled=[];   // ai bị xếp 2 buổi/ngày (để báo)

  function fillPass(relaxed){
    // relaxed = pass phủ ca: bỏ trần tuần + cho 2 buổi/ngày + bỏ luật lặp buổi.
    // Luôn giữ: cấm ghép Sáng+Tối (7h→00h).
    const mday=relaxed? Math.max(2,maxDay) : maxDay;
    const cap =relaxed? 999 : maxS;
    for(let d=0; d<7; d++){
      const ds=ymd(addDays(mon,d));
      DB.shiftTypes.forEach(st=>{
        const pk=coveredPeriods(st)[0]; const req=reqFor(st);
        DB.settings.positions.forEach(role=>{
          const need=req[role]||0;
          while(haveShift(d,st.id,role)<need){
            const eligible=DB.employees.filter(e=> e.pos===role && !onLeave(ds,e.id) && isFreeForShift(avail,e.id,d,st)
              && !busyOverlap(e.id,d,st) && load[e.id]<cap);
            if(!eligible.length) break;
            const okDay=e=>{
              const pks=periodsToday(e.id,d);
              if(pks.length>=mday) return false;
              if(pk==='m'&&pks.includes('e')) return false;   // luôn cấm Sáng+Tối
              if(pk==='e'&&pks.includes('m')) return false;
              if(!relaxed && noConsec && sameBuoiYesterday(e.id,d,pk)) return false;
              return true;
            };
            const cands=eligible.filter(okDay);
            if(!cands.length) break;
            cands.sort((a,b)=>{
              if(pk==='e'){ const at=cnt[a.id].e<minToi?0:1, bt=cnt[b.id].e<minToi?0:1; if(at!==bt)return at-bt; }
              const am=load[a.id]<minS?0:1, bm=load[b.id]<minS?0:1; if(am!==bm)return am-bm;
              if(load[a.id]!==load[b.id]) return load[a.id]-load[b.id];
              return cnt[a.id][pk]-cnt[b.id][pk];
            });
            const pick=cands[0];
            if(periodsToday(pick.id,d).length>=1) doubled.push({name:pick.name,day:d});
            newWeek[pick.id]=newWeek[pick.id]||{}; (newWeek[pick.id][d]=newWeek[pick.id][d]||[]).push({typeId:st.id,pos:role});
            load[pick.id]++; cnt[pick.id][pk]++;
          }
        });
      });
    }
  }
  fillPass(false);                                   // vòng 1: công bằng, nhân đạo
  if(DB.settings.coverFirst!==false) fillPass(true); // vòng 2: phủ nốt chỗ trống (cho 2 buổi/ngày)
  // tính chỗ còn trống (theo từng CA)
  for(let d=0; d<7; d++) DB.shiftTypes.forEach(st=>DB.settings.positions.forEach(role=>{
    const need=reqFor(st)[role]||0; const have=haveShift(d,st.id,role);
    if(have<need) gaps.push({day:d,pk:coveredPeriods(st)[0],role,filled:have,need,label:st.label});
  }));
  DB.schedule[wk]=newWeek; save();
  const under=DB.employees.filter(e=>minS>0 && load[e.id]<minS).map(e=>({name:e.name,got:load[e.id]}));
  // chẩn đoán vì sao chưa đủ ca tối: do ít đăng ký rảnh tối, hay do hết suất?
  const roleCount={}; DB.employees.forEach(e=>roleCount[e.pos]=(roleCount[e.pos]||0)+1);
  const toiCap={}; DB.settings.positions.forEach(r=>{ let sum=0; DB.shiftTypes.forEach(st=>{ if(coveredPeriods(st).includes('e')) sum+=(reqFor(st)[r]||0); }); toiCap[r]=sum*7; });
  const underToi=DB.employees.filter(e=>minToi>0 && load[e.id]>0 && cnt[e.id].e<minToi).map(e=>{
    let availToi=0; for(let d=0;d<7;d++) if(avail[e.id]&&avail[e.id][d]&&avail[e.id][d].includes('e')) availToi++;
    const capShort=(toiCap[e.pos]||0) < minToi*(roleCount[e.pos]||0);
    return {name:e.name, got:cnt[e.id].e, availToi, role:e.pos,
            why: availToi<minToi ? 'avail' : (capShort?'cap':'other'),
            cap:toiCap[e.pos]||0, nRole:roleCount[e.pos]||0};
  });
  // gộp danh sách người bị xếp 2 buổi/ngày
  const dblMap={}; doubled.forEach(x=>{ (dblMap[x.name]=dblMap[x.name]||[]).push(DOW[x.day]); });
  const doubles=Object.keys(dblMap).map(n=>({name:n,days:[...new Set(dblMap[n])]}));
  return {gaps, under, underToi, doubles, load, minS, minToi};
}

function pkName(pk){return PERIODS.find(p=>p.key===pk).name;}
function showScheduleResult(res){
  const {created=[],gaps=[],under=[],underToi=[],doubles=[],minS=0,minToi=0}=res; const mon=curMonday;
  let html=`<div class="grip"></div><h2>✅ Đã tự xếp ca</h2><div class="sub">Tuần ${dmShort(mon)} – ${dmShort(addDays(mon,6))} · đã chia cân bằng</div>`;

  if(gaps.length) html+=`<div class="warnbox"><h3>⚠️ Thiếu người (không đủ người rảnh)</h3><ul>${gaps.map(g=>`<li><b>${DOW[g.day]}</b> ca ${g.label||pkName(g.pk)} · ${g.role}: ${g.filled}/${g.need}</li>`).join('')}</ul><p style="font-size:12.5px;margin:6px 0 0;color:#7d2622">Vào ngày đó bấm "+ Thêm" để xếp bù.</p></div>`;
  if(under.length) html+=`<div class="warnbox" style="background:#FFF4E0;border-color:#F0D9A8"><h3 style="color:#9a6a10">Chưa đủ ${minS} ca tối thiểu</h3><ul>${under.map(u=>`<li style="color:#7a5410">${esc(u.name)}: ${u.got}/${minS} ca (do rảnh ít hoặc ca đã đầy)</li>`).join('')}</ul></div>`;
  if(underToi.length){
    const capRoles=[...new Set(underToi.filter(u=>u.why==='cap').map(u=>u.role))];
    html+=`<div class="warnbox" style="background:#EFEAFB;border-color:#D6CBF3"><h3 style="color:#5b45a8">Chưa đủ ${minToi} ca tối</h3><ul>${underToi.map(u=>{
      const why = u.why==='avail' ? `chỉ đăng ký rảnh ${u.availToi} buổi tối`
                : u.why==='cap'   ? `hết suất — ca tối chỉ có ${u.cap} suất/tuần cho ${u.nRole} bạn ${u.role}`
                : `ca tối đã đủ người khác`;
      return `<li style="color:#4b3a8a"><b>${esc(u.name)}</b>: ${u.got}/${minToi} ca tối — ${why}</li>`;
    }).join('')}</ul>${capRoles.length?`<p style="font-size:12.5px;margin:8px 0 0;color:#4b3a8a">💡 Không thể ai cũng đủ ${minToi} ca tối: số ${capRoles.join('/')} đang nhiều hơn số suất tối. Hạ "Số ca tối tối thiểu" xuống, hoặc tăng định mức ca Tối, hoặc chấp nhận vài bạn ít ca tối hơn.</p>`:''}</div>`;
  }
  if(doubles.length) html+=`<div class="warnbox" style="background:#E7F1FB;border-color:#C4DBF0"><h3 style="color:#2b5f8a">Làm 2 buổi/ngày (để phủ đủ ca)</h3><ul>${doubles.map(x=>`<li style="color:#274e6e"><b>${esc(x.name)}</b> · ${x.days.join(', ')}</li>`).join('')}</ul><p style="font-size:12.5px;margin:6px 0 0;color:#274e6e">Do vị trí này thiếu người. Không có ca Sáng+Tối kiểu 7h→nửa đêm — chỉ ghép liền mạch.</p></div>`;
  if(!gaps.length&&!under.length&&!underToi.length&&!doubles.length) html+=`<div class="empty" style="padding:20px"><div class="big">🎉</div>Đủ người mọi ca, chia cân bằng!</div>`;
  html+=`<button class="btn wide" id="okImport" style="margin-top:12px">Xem lịch tuần</button>`;
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('okImport').onclick=closeSheet;
  openSheet();
}

/* ---------- export week as image ---------- */
function exportWeekImage(){
  const mon=curMonday, sun=addDays(mon,6);
  const emps=DB.employees;
  if(!emps.length){toast('Chưa có nhân viên');return;}
  const scale=2;
  const nameW=120, colW=118, headH=70, rowH=64, titleH=76, padX=18, footH=40;
  const W=nameW+colW*7+padX*2;
  const H=titleH+headH+rowH*emps.length+footH+padX;
  const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale;
  const x=cv.getContext('2d'); x.scale(scale,scale);
  const col={bg:'#F5EDE7',surf:'#FFFCFA',ink:'#2B1C19',muted:'#8B7770',line:'#E9DAD3',brand:'#8C2018',
    m:'#FBEBD3',a:'#D8F0EC',e:'#E9E2FA',full:'#F6DFD3',off:'#ECE6DE',
    mT:'#8a5410',aT:'#186b60',eT:'#4b34a0',fullT:'#8f3a17',offT:'#7a6d5f'};
  x.fillStyle=col.bg; x.fillRect(0,0,W,H);
  // title
  x.fillStyle=col.brand; x.font='800 23px -apple-system,system-ui,sans-serif'; x.textBaseline='top';
  x.fillText('TIỆM CÀ PHÊ CÁ HỒI — '+(DB.settings.branch||''),padX,padX);
  x.fillStyle=col.muted; x.font='600 15px -apple-system,system-ui,sans-serif';
  x.fillText(`Tuần ${dmShort(mon)} – ${dmShort(sun)}`,padX,padX+34);
  const ox=padX, oy=titleH;
  // header
  x.fillStyle=col.surf; x.fillRect(ox,oy,nameW+colW*7,headH);
  const todayStr=ymd(new Date());
  for(let d=0;d<7;d++){
    const date=addDays(mon,d); const cx=ox+nameW+colW*d;
    if(ymd(date)===todayStr){ x.fillStyle='#F3E1D2'; x.fillRect(cx,oy,colW,headH); }
    x.fillStyle=col.muted; x.font='700 14px system-ui,sans-serif'; x.textAlign='center';
    x.fillText(DOW[d],cx+colW/2,oy+12);
    x.fillStyle=col.ink; x.font='700 17px system-ui,sans-serif';
    x.fillText(dmShort(date),cx+colW/2,oy+34);
  }
  x.textAlign='left';
  // rows
  let hasBike=false;
  emps.forEach((e,r)=>{
    const ry=oy+headH+rowH*r;
    x.fillStyle=r%2?col.surf:'#FBF5EC'; x.fillRect(ox,ry,nameW+colW*7,rowH);
    x.fillStyle=col.ink; x.font='700 15px system-ui,sans-serif';
    x.fillText(trunc(x,e.name,nameW-16),ox+10,ry+12);
    const wh=weekHours(mon,e.id);
    x.fillStyle=col.muted; x.font='600 12px system-ui,sans-serif';
    x.fillText(fmtH(wh)+(e.rate?' · '+money(wh*e.rate):''),ox+10,ry+34);
    for(let d=0;d<7;d++){
      const shifts=cellShifts(mon,e.id,d); const cx=ox+nameW+colW*d;
      let cy=ry+8;
      shifts.slice(0,2).forEach(c=>{
        const t=typeById(c.typeId); if(!t)return;
        const cls=shiftClass(t);
        if(c.bike) hasBike=true;
        x.fillStyle=col[cls]; roundRect(x,cx+6,cy,colW-12,shifts.length>1?22:44,7); x.fill();
        x.fillStyle=col[cls+'T']; x.font='700 12px system-ui,sans-serif';
        x.fillText((c.bike?'🛵 ':'')+t.label,cx+12,cy+ (shifts.length>1?5:6));
        if(shifts.length===1&&c.pos){x.font='600 11px system-ui,sans-serif';x.fillText((c.bike?'🛵 ':'')+c.pos,cx+12,cy+24);}
        cy+= shifts.length>1?26:0;
      });
    }
  });
  // grid lines
  x.strokeStyle=col.line; x.lineWidth=1;
  for(let d=0;d<=7;d++){const cx=ox+nameW+colW*d;x.beginPath();x.moveTo(cx,oy);x.lineTo(cx,oy+headH+rowH*emps.length);x.stroke();}
  for(let r=0;r<=emps.length;r++){const ry=oy+headH+rowH*r;x.beginPath();x.moveTo(ox,ry);x.lineTo(ox+nameW+colW*7,ry);x.stroke();}
  x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+nameW+colW*7,oy);x.stroke();
  // footer
  x.fillStyle=col.muted; x.font='600 12px system-ui,sans-serif';
  x.fillText('Tiệm Cà Phê Cá Hồi · app Xếp Ca'+(hasBike?'  ·  🛵 = người giữ xe':''),ox,oy+headH+rowH*emps.length+12);

  cv.toBlob(blob=>{
    const file=new File([blob],`lich-tuan-${dmShort(mon).replace('/','-')}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Lịch làm tuần'}).catch(()=>{});
    }else{
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
      toast('Đã tải ảnh về máy');
    }
  },'image/png');
}
function trunc(x,s,max){ if(x.measureText(s).width<=max)return s; while(s.length&&x.measureText(s+'…').width>max)s=s.slice(0,-1); return s+'…'; }
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

      const e=empById(l.empId); const past=(l.dateEnd||l.date)<today;

  }else{

      const e=empById(l.empId); const past=l.date<today;

        <div class="info"><b>${e?e.name:'(đã xoá)'}</b><span>${fmtDate(l.date)} · về lúc ${l.time}${l.reason?' · '+esc(l.reason):''}</span></div>

  document.getElementById('tabEarly').onclick=()=>{leaveTab='early';renderLeave();};

        <div><b style="font-size:14px">Tối đa buổi / người / ngày</b><div class="muted" style="font-size:12px">Để <b>1</b> nếu mỗi ngày chỉ làm 1 buổi. App luôn cấm ghép Sáng+Tối cùng ngày.</div></div>
        <input id="setMaxDay" inputmode="numeric" value="${DB.settings.maxPerDay||2}" style="width:64px;height:44px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px">
      </div>
      <div class="row between" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div style="flex:1"><b style="font-size:14px">Ưu tiên phủ đủ ca</b><div class="muted" style="font-size:12px">Khi vị trí thiếu người, cho làm 2 buổi/ngày (liền mạch) để không trống ca</div></div>
        <button id="setCoverFirst" class="tgl ${DB.settings.coverFirst!==false?'on':''}"><span></span></button>
      </div>
    </div>

    <div class="sec-title">Khung giờ ca &amp; số giờ</div>
    <div class="card"><div id="shiftList">`;
  DB.shiftTypes.forEach(t=>{
    html+=`<div class="li"><span class="dot c-${shiftClass(t)}"></span>
      <div class="info"><b>${t.label}</b><span>${fmtH(t.hours)}</span></div>
      <button class="icon-btn" data-editshift="${t.id}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>`;
  });
  html+=`</div><div class="pad"><button class="btn ghost wide sm" id="addShiftType">+ Thêm khung giờ</button></div></div>

    <div class="sec-title">Vị trí công việc</div>
    <div class="card pad"><div class="field" style="margin:0"><label>Ngăn cách bằng dấu phẩy</label>
      <input id="setPos" value="${esc(DB.settings.positions.join(', '))}"></div></div>

    <div class="sec-title">Sao lưu dữ liệu</div>
    <div class="card pad">
      <p class="muted" style="margin:0 0 12px;font-size:13.5px">Dữ liệu chỉ lưu trong iPhone này. Nên sao lưu định kỳ phòng khi đổi máy.</p>
      <div class="two">
        <button class="btn ghost" id="btnBackup">Xuất file sao lưu</button>
        <button class="btn ghost" id="btnRestore">Khôi phục</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json" style="display:none">
    </div>

    <div class="sec-title">Khác</div>
    <div class="card pad">
      <button class="btn ghost wide danger-text" id="btnReset">Xoá toàn bộ dữ liệu</button>
    </div>
    <p class="muted" style="text-align:center;font-size:12px;margin:22px 0 8px">Xếp Ca · lưu offline trên máy</p>`;
  el.innerHTML=html;

  document.getElementById('setBranch').onchange=ev=>{DB.settings.branch=ev.target.value.trim()||'Cơ sở 3';save();render();};
  document.getElementById('setSheet').onchange=ev=>{DB.settings.sheetUrl=ev.target.value.trim();save();};
  document.querySelectorAll('.rq-in').forEach(inp=>inp.onchange=ev=>{
    const st=ev.target.dataset.st, role=ev.target.dataset.role;
    DB.settings.req[st]=DB.settings.req[st]||{};
    DB.settings.req[st][role]=Math.max(0,parseInt(ev.target.value)||0);
    save();
  });
  document.getElementById('setMinShifts').onchange=ev=>{DB.settings.minShifts=Math.max(0,parseInt(ev.target.value)||0);save();};
  document.getElementById('setMaxShifts').onchange=ev=>{DB.settings.maxShifts=Math.max(1,parseInt(ev.target.value)||99);save();};
  document.getElementById('setMinToi').onchange=ev=>{DB.settings.minToi=Math.max(0,parseInt(ev.target.value)||0);save();};
  document.getElementById('setNoConsec').onclick=ev=>{DB.settings.noSameConsec=!DB.settings.noSameConsec;save();renderSettings();};
  document.getElementById('setMaxDay').onchange=ev=>{DB.settings.maxPerDay=Math.min(3,Math.max(1,parseInt(ev.target.value)||2));save();};
  document.getElementById('setCoverFirst').onclick=()=>{DB.settings.coverFirst=!(DB.settings.coverFirst!==false);save();renderSettings();};
  document.getElementById('setPos').onchange=ev=>{const arr=ev.target.value.split(',').map(s=>s.trim()).filter(Boolean);if(arr.length){DB.settings.positions=arr;save();render();}};
  document.querySelectorAll('[data-editshift]').forEach(b=>b.onclick=()=>openShiftTypeSheet(b.dataset.editshift));
  document.getElementById('addShiftType').onclick=()=>openShiftTypeSheet();
  document.getElementById('btnBackup').onclick=backup;
  document.getElementById('btnRestore').onclick=()=>document.getElementById('restoreFile').click();
  document.getElementById('restoreFile').onchange=restore;
  document.getElementById('btnReset').onclick=()=>{
    if(confirm('Xoá TẤT CẢ nhân viên, lịch, đơn nghỉ? Không thể hoàn tác.')){
      DB=defaultData();save();toast('Đã xoá sạch');go('week');
    }
  };
}
function openShiftTypeSheet(id){
  const t=id?typeById(id):null;
  let html=`<div class="grip"></div><h2>${t?'Sửa khung giờ':'Thêm khung giờ'}</h2>
    <div class="sub">Ghi dạng <b>7h-12h30</b>. App tự nhận biết sáng/chiều/tối.</div>
    <div class="field"><label>Khung giờ</label><input id="stLabel" value="${t?esc(t.label):''}" placeholder="VD: 7h-12h30"></div>
    <div class="field"><label>Số giờ công (để tính lương)</label><input id="stHours" inputmode="decimal" value="${t?t.hours:''}" placeholder="VD: 5.5"></div>
    <button class="btn wide" id="stSave">${t?'Lưu':'Thêm'}</button>`;
  if(t)html+=`<button class="btn ghost wide danger-text" id="stDel" style="margin-top:10px">Xoá khung giờ</button>`;
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('stSave').onclick=()=>{
    const label=document.getElementById('stLabel').value.trim();
    const hours=parseFloat(document.getElementById('stHours').value.replace(',','.'));
    if(!label||isNaN(hours)){toast('Nhập đủ khung giờ & số giờ');return;}
    if(t){Object.assign(t,{label,hours});}else{DB.shiftTypes.push({id:uid(),label,hours});}
    save();closeSheet();toast('Đã lưu');render();
  };
  if(t)document.getElementById('stDel').onclick=()=>{
    if(!confirm('Xoá khung giờ này?'))return;
    DB.shiftTypes=DB.shiftTypes.filter(z=>z.id!==t.id);save();closeSheet();toast('Đã xoá');render();
  };
  openSheet();
}
function backup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`xepca-saoluu-${ymd(new Date())}.json`; a.click();
  toast('Đã xuất file sao lưu');
}
function restore(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{ const d=JSON.parse(rd.result);
      if(!d.settings||!d.shiftTypes)throw 0;
      if(!confirm('Khôi phục sẽ thay thế dữ liệu hiện tại. Tiếp tục?'))return;
      DB=d; save(); toast('Đã khôi phục'); go('week');
    }catch(e){ toast('File sao lưu không hợp lệ'); }
  };
  rd.readAsText(f);
  ev.target.value='';
}

/* ============================================================
   SHEET + TOAST helpers
   ============================================================ */
const backdrop=document.getElementById('backdrop'), sheet=document.getElementById('sheet');
function openSheet(){backdrop.classList.add('show');requestAnimationFrame(()=>sheet.classList.add('show'));}
function closeSheet(){sheet.classList.remove('show');backdrop.classList.remove('show');}
backdrop.onclick=closeSheet;
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){return Math.round(n).toLocaleString('vi-VN')+'đ';}
function fmtDate(s){const d=parseYMD(s);return `${DOW[(d.getDay()+6)%7]} ${dmShort(d)}`;}
function fmtRange(a,b){if(!b||b===a)return fmtDate(a);return `${dmShort(parseYMD(a))} → ${dmShort(parseYMD(b))}`;}

/* ---------- service worker + tự cập nhật ---------- */
if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return; refreshing=true; location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw&&nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage&&0; // bản mới sẵn sàng
      });
    });
    // kiểm tra bản mới mỗi khi mở lại app
    if(reg.update) reg.update();
  }).catch(()=>{});
}

/* ---------- go ---------- */
document.getElementById('importFile').onchange=onImportFile;
go('week');
</script>
